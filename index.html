function ensureParts(){for(let r in ROBOTS){if(!(r in parts))parts[r]=0;}for(let w in WEAPONS){if(!(w in parts))parts[w]=0;}for(let d in DRONES){if(!(d in parts))parts[d]=0;}}
function saveAccount(){if(!currentAccount)return;const a=accounts[currentAccount]||{};a.silver=silver;a.gold=gold;a.soulCoins=soulCoins;a.parts=JSON.parse(JSON.stringify(parts));a.hangarSlots=JSON.parse(JSON.stringify(hangarSlots));a.lastGiftTime=lastGiftTime;a.campaignProgress=campaignProgress;a.freeGoldUsed=freeGoldUsed;a.lastWheelSpin=lastWheelSpin;a.achievements=achievements;a.totalKills=totalKills;a.totalWins=totalWins;a.totalLosses=totalLosses;a.totalDamage=totalDamage;a.favoriteRobot=favoriteRobot;a.favoriteRobotKills=favoriteRobotKills;a.robotKillCounts=robotKillCounts;a.dailyQuests=dailyQuests;a.dailyQuestProgress=dailyQuestProgress;a.dailyQuestsCompleted=dailyQuestsCompleted;a.lastDailyReset=lastDailyReset;a.dailyLoginDay=dailyLoginDay;a.lastLoginDate=lastLoginDate;a.prestigeLevel=prestigeLevel;a.dailyChallengeProgress=dailyChallengeProgress;a.lastDailyChallengeReset=lastDailyChallengeReset;accounts[currentAccount]=a;localStorage.setItem('wr1.37f2',JSON.stringify(accounts));}
function loadAccount(name){const s=localStorage.getItem('wr1.37f2');if(s)try{accounts=JSON.parse(s);}catch(e){}const d=accounts[name];if(!d)return false;currentAccount=name;silver=d.silver||500;gold=d.gold||50;soulCoins=d.soulCoins||0;parts=d.parts||{};hangarSlots=d.hangarSlots||[];lastGiftTime=d.lastGiftTime||0;campaignProgress=d.campaignProgress||1;freeGoldUsed=d.freeGoldUsed||false;lastWheelSpin=d.lastWheelSpin||0;achievements=d.achievements||{};totalKills=d.totalKills||0;totalWins=d.totalWins||0;totalLosses=d.totalLosses||0;totalDamage=d.totalDamage||0;favoriteRobot=d.favoriteRobot||'';favoriteRobotKills=d.favoriteRobotKills||0;robotKillCounts=d.robotKillCounts||{};dailyQuests=d.dailyQuests||[];dailyQuestProgress=d.dailyQuestProgress||[0,0,0];dailyQuestsCompleted=d.dailyQuestsCompleted||[false,false,false];lastDailyReset=d.lastDailyReset||0;dailyLoginDay=d.dailyLoginDay||1;lastLoginDate=d.lastLoginDate||'';prestigeLevel=d.prestigeLevel||0;dailyChallengeProgress=d.dailyChallengeProgress||0;lastDailyChallengeReset=d.lastDailyChallengeReset||0;ensureParts();while(hangarSlots.length<5)hangarSlots.push({robotName:null,weapons:[],drone:null,mkLevel:'MK1',level:1,currentHp:null,modules:[null,null],pilot:null});hangarSlots.forEach(s=>{if(!s.mkLevel)s.mkLevel='MK1';if(!s.level)s.level=1;});return true;}
function initNewAccount(name){currentAccount=name;silver=500;gold=50;parts={};ensureParts();parts['LightCannon']=3;campaignProgress=1;freeGoldUsed=false;lastWheelSpin=0;achievements={};totalKills=0;totalWins=0;totalLosses=0;totalDamage=0;favoriteRobot='';favoriteRobotKills=0;robotKillCounts={};dailyQuests=[];dailyQuestProgress=[0,0,0];dailyQuestsCompleted=[false,false,false];lastDailyReset=0;dailyLoginDay=1;lastLoginDate=new Date().toDateString();prestigeLevel=0;dailyChallengeProgress=0;lastDailyChallengeReset=0;hangarSlots=[{robotName:'Destrier',weapons:[{name:'LightCannon',mkLevel:'MK1',level:1},null],drone:null,mkLevel:'MK1',level:1,currentHp:null,modules:[null,null],pilot:null}];for(let i=1;i<5;i++)hangarSlots.push({robotName:null,weapons:[],drone:null,mkLevel:'MK1',level:1,currentHp:null,modules:[null,null],pilot:null});accounts[name]={};saveAccount();showHangar();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function showHangar(){showScreen('hangar-screen');updateHangarUI();checkDailyLogin();checkDailyChallengeReset();document.getElementById('prestige-btn').style.display=totalKills>=5000?'inline-block':'none';canvas.focus();}
function logout(){currentAccount=null;combatActive=false;showScreen('login-screen');}
function checkDailyLogin(){const today=new Date().toDateString();if(lastLoginDate!==today){if(lastLoginDate===new Date(Date.now()-864e5).toDateString())dailyLoginDay=Math.min(7,dailyLoginDay+1);else dailyLoginDay=1;lastLoginDate=today;const rewards=['+100💰','+5⭐','+3👻','+2 детали','+500💰 +10⭐ +5👻','Случайный дрон','🚀 ДЖЕКПОТ'];let bonus=rewards[Math.min(dailyLoginDay-1,6)];if(dailyLoginDay===1)silver+=100;if(dailyLoginDay===2)gold+=5;if(dailyLoginDay===3)soulCoins+=3;if(dailyLoginDay===4){const items=ALL_ROBOT_NAMES.filter(r=>!ROBOTS[r].legendary);if(items.length)parts[items[Math.floor(Math.random()*items.length)]]+=2;}if(dailyLoginDay===5){silver+=500;gold+=10;soulCoins+=5;}if(dailyLoginDay===6){const drones=['Soulkeeper','Aegis Guardian','Scales Drone','Storm Drone'];const dn=drones[Math.floor(Math.random()*drones.length)];parts[dn]=(parts[dn]||0)+DRONES[dn].parts;bonus=dn;}if(dailyLoginDay===7){const leg=Object.entries(ROBOTS).filter(([n,d])=>d.legendary);if(leg.length){const[ln]=leg[Math.floor(Math.random()*leg.length)];parts[ln]=(parts[ln]||0)+1;bonus=ln;}}showModal(`<h3>🎁 ДЕНЬ ${dailyLoginDay}</h3><h2 style="color:var(--gold);">${bonus}</h2><button onclick="hideModal()">ЗАБРАТЬ</button>`);saveAccount();}}
function checkDailyChallengeReset(){const today=new Date().toDateString();if(lastDailyChallengeReset!==today){lastDailyChallengeReset=today;dailyChallengeProgress=0;saveAccount();}}
function updateDailyChallengeProgress(val){const today=new Date().toDateString();if(lastDailyChallengeReset!==today){lastDailyChallengeReset=today;dailyChallengeProgress=0;}dailyChallengeProgress=Math.min(50,dailyChallengeProgress+val);if(dailyChallengeProgress>=50){silver+=1000;gold+=100;soulCoins+=10;showToast('🔥 Дневное испытание выполнено!');dailyChallengeProgress=0;}saveAccount();document.getElementById('daily-challenge-progress').textContent=`🔥 ${dailyChallengeProgress}/50`;}
function getOwnedRobots(){const owned=hangarSlots.filter(s=>s.robotName).map(s=>s.robotName);return owned.length?owned:['Destrier'];}
function getLeaderboard(){const lb=[];const stored=localStorage.getItem('wr1.37f2');if(stored){try{const all=JSON.parse(stored);for(let name in all){if(all[name]&&all[name].totalKills!==undefined)lb.push({name,totalKills:all[name].totalKills||0});}}catch(e){}}return lb.sort((a,b)=>b.totalKills-a.totalKills).slice(0,10);}
function openLeaderboard(){const lb=getLeaderboard();let h='<h3>🏅 ТАБЛИЦА ЛИДЕРОВ</h3><button class="close-btn" onclick="hideModal()">✕</button>';if(lb.length===0)h+='<p>Нет данных</p>';else lb.forEach((e,i)=>{const titles=e.totalKills<100?'Новобранец':e.totalKills<500?'Пилот':e.totalKills<1000?'Ветеран':e.totalKills<5000?'Элита':'Легенда';h+=`<div class="item-row"><span>#${i+1} ${e.name}</span><span>${e.totalKills} убийств [${titles}]</span></div>`;});showModal(h);}
function updateHangarUI(){const sl=document.getElementById('slot-list');sl.innerHTML='<h3 style="color:var(--gold);">АНГАР</h3>';for(let i=0;i<hangarSlots.length;i++){const s=hangarSlots[i];const d=document.createElement('div');d.style.cssText=`padding:4px;cursor:pointer;border-radius:4px;border:1px solid ${i===selectedSlot?'var(--accent)':'var(--border)'};font-size:10px;`;d.innerHTML=s.robotName?`<b>${s.robotName.substring(0,12)}</b>`:'<span style="color:#666;">—</span>';d.addEventListener('click',()=>{selectedSlot=i;updateHangarUI();});sl.appendChild(d);}document.getElementById('silver-display').textContent=silver;document.getElementById('gold-display').textContent=gold;document.getElementById('soul-display').textContent=soulCoins;document.getElementById('pilot-name-display').textContent=(currentAccount||'Гость')+(prestigeLevel>0?` [P${prestigeLevel}]`:'');updateRobotDisplay();updateRobotStats();if(hangarSlots.filter(s=>s.robotName).length>=10&&!achievements.collector)checkAchievement('collector');document.getElementById('prestige-btn').style.display=totalKills>=5000?'inline-block':'none';document.getElementById('daily-challenge-progress').textContent=`🔥 ${dailyChallengeProgress}/50`;}
function updateRobotDisplay(){const d=document.getElementById('robot-display');const s=hangarSlots[selectedSlot];if(!s.robotName){d.innerHTML='<div style="padding:50px;"><button onclick="openRobotSelectionModal()" class="success">Собрать робота</button></div>';return;}const r=ROBOTS[s.robotName];d.innerHTML=`<h3 style="color:${r.color};">${s.robotName}</h3><div style="background:${r.color};width:90px;height:90px;border-radius:50%;margin:10px auto;"></div><p>${r.ability||'Нет'}</p>`;}
function updateRobotStats(){const st=document.getElementById('robot-stats');const s=hangarSlots[selectedSlot];if(!s.robotName){st.innerHTML='';return;}const r=ROBOTS[s.robotName];st.innerHTML=`<h4>${s.robotName}</h4><p>HP: ${Math.round(getRobotStat(s,'hp'))}</p><p>Скорость: ${getRobotStat(s,'speed').toFixed(1)}</p><p>${s.mkLevel}.${s.level}</p><button onclick="upgradeRobot()" class="gold">↑ Улучшить</button><button onclick="maxUpgradeRobot()" class="gold">⚡ MAX</button>`;}
function upgradeRobot(){const s=hangarSlots[selectedSlot];if(!s.robotName)return;if(!s.mkLevel)s.mkLevel='MK1';if(!s.level)s.level=1;if(s.mkLevel==='MK3'){showToast('Уже MK3!');return;}if(s.mkLevel==='MK1'&&s.level>=12){if(gold<1000)return;gold-=1000;s.mkLevel='MK2';s.level=1;}else if(s.mkLevel==='MK2'&&s.level>=12){if(gold<2000||silver<5000)return;gold-=2000;silver-=5000;s.mkLevel='MK3';s.level=1;checkAchievement('maximist');}else{const cost=s.level*50+100;if(silver<cost)return;silver-=cost;s.level++;}saveAccount();updateHangarUI();}
function maxUpgradeRobot(){const s=hangarSlots[selectedSlot];if(!s.robotName)return;let tS=0,tG=0;const mk=s.mkLevel||'MK1';let lvl=s.level||1;if(mk==='MK3'){showToast('Уже MK3!');return;}for(let i=lvl;i<12&&mk!=='MK3';i++){tS+=i*50+100;if(i===11&&mk==='MK1'){tG+=1000;mk='MK2';i=0;}if(i===11&&mk==='MK2'){tG+=2000;tS+=5000;mk='MK3';}}if(silver<tS||gold<tG){showToast(`Нужно ${tS}💰 ${tG}⭐`);return;}silver-=tS;gold-=tG;s.mkLevel='MK3';s.level=1;checkAchievement('maximist');showToast('⚡ MK3!');saveAccount();updateHangarUI();}
function assignPilot(){const s=hangarSlots[selectedSlot];if(!s.robotName||!PILOTS[s.robotName])return;const pdef=PILOTS[s.robotName];const pool=[...RANDOM_SKILLS];const skills=[];for(let i=0;i<2;i++){const idx=Math.floor(Math.random()*pool.length);skills.push(pool.splice(idx,1)[0]);}s.pilot={name:pdef.name,uniqueSkill:pdef.uniqueSkill,skills};saveAccount();updateHangarUI();showToast('👨‍✈️ Нанят '+pdef.name);}
function openRobotSelectionModal(){let h='<h3>Сборка</h3><button class="close-btn" onclick="hideModal()">✕</button>';for(let[n,d]of Object.entries(ROBOTS)){if(d.costSouls)continue;const ow=hangarSlots.some(s=>s.robotName===n),hv=parts[n]||0;h+=`<div class="item-row" onclick="${hv>=d.parts?'buildRobot(\''+n+'\')':''}" style="${hv<d.parts?'opacity:0.5':''}"><span>${n}${d.legendary?'👑':''}</span><span>${ow?'✅':hv+'/'+d.parts}</span></div>`;}showModal(h);}
function buildRobot(name){const d=ROBOTS[name];if(!d)return;if(hangarSlots.some(s=>s.robotName===name))return;if(name!=='Destrier'&&(parts[name]||0)<d.parts)return;if(name!=='Destrier')parts[name]-=d.parts;hangarSlots[selectedSlot]={robotName:name,weapons:new Array(d.slots.length).fill(null),drone:null,mkLevel:'MK1',level:1,currentHp:null,modules:[null,null],pilot:null};saveAccount();hideModal();updateHangarUI();}
function openWeaponSelectionModal(idx){const s=hangarSlots[selectedSlot];if(!s.robotName)return;const tp=ROBOTS[s.robotName].slots[idx];let h=`<h3>Оружие #${idx+1}</h3><button class="close-btn" onclick="hideModal()">✕</button>`;for(let[n,d]of Object.entries(WEAPONS)){if(d.type!==tp)continue;const hv=parts[n]||0;h+=`<div class="item-row" onclick="${hv>=1?'equipWeapon('+idx+',\''+n+'\')':''}" style="${hv<1?'opacity:0.5':''}"><span>${n} (${d.dmg})</span><span>${hv}/1</span></div>`;}showModal(h);}
function equipWeapon(idx,name){if((parts[name]||0)<1)return;parts[name]-=1;hangarSlots[selectedSlot].weapons[idx]={name,mkLevel:'MK1',level:1};saveAccount();hideModal();updateHangarUI();}
function openBox(){if(silver<100)return;silver-=100;const sg=Math.floor(Math.random()*51)+30;silver+=sg;let msg=`📦 +${sg}💰`;if(Math.random()<0.3){const gg=Math.floor(Math.random()*8)+3;gold+=gg;msg+=`, +${gg}⭐`;}if(Math.random()<0.2){const items=ALL_ROBOT_NAMES.filter(r=>!ROBOTS[r].legendary);if(items.length){const it=items[Math.floor(Math.random()*items.length)];parts[it]=(parts[it]||0)+2;msg+=`, +2 дет. ${it}`;}}showToast(msg);saveAccount();updateHangarUI();}
function claimGift(){const now=Date.now();if(now-lastGiftTime<6e5){showToast('Подождите');return;}lastGiftTime=now;silver+=80;gold+=5;showToast('🎁 +80💰, +5⭐');saveAccount();}
function openWheel(){if(Date.now()-lastWheelSpin<864e5&&lastWheelSpin>0){showToast('Раз в день!');return;}lastWheelSpin=Date.now();const prize=WHEEL_PRIZES[Math.floor(Math.random()*WHEEL_PRIZES.length)];if(prize.includes('ДЖЕКПОТ')){silver+=5000;gold+=50;const leg=Object.entries(ROBOTS).filter(([n,d])=>d.legendary);if(leg.length){const[ln]=leg[Math.floor(Math.random()*leg.length)];parts[ln]=(parts[ln]||0)+1;showToast('🎡 ДЖЕКПОТ! '+ln);}}else{if(prize.includes('💰'))silver+=parseInt(prize);else if(prize.includes('⭐'))gold+=parseInt(prize);else if(prize.includes('👻'))soulCoins+=parseInt(prize);else{const items=ALL_ROBOT_NAMES.filter(r=>!ROBOTS[r].legendary);if(items.length)parts[items[Math.floor(Math.random()*items.length)]]+=5;}showToast('🎡 '+prize);}saveAccount();}
function openBattleModes(){const modes=[{id:'TDM',icon:'⚔️',name:'TDM'},{id:'SURVIVAL',icon:'💀',name:'ВЫЖИВАНИЕ'},{id:'ARENA',icon:'🏟️',name:'АРЕНА'},{id:'BOSS',icon:'👹',name:'ОХОТА'},{id:'CLEAR',icon:'🧹',name:'ЗАЧИСТКА'},{id:'HEIST',icon:'💰',name:'ОГРАБЛЕНИЕ'},{id:'TEAMDUEL',icon:'🤝',name:'ДУЭЛЬ 2v2'}];let h='<h3>⚔️ РЕЖИМЫ</h3><button class="close-btn" onclick="hideModal()">✕</button><div style="display:flex;flex-wrap:wrap;">';modes.forEach(m=>{h+=`<div class="mode-card"><h4>${m.icon} ${m.name}</h4><button onclick="hideModal();startBattle('${m.id}')" class="success">В БОЙ</button></div>`;});h+='</div>';showModal(h);}
function openStats(){const total=totalWins+totalLosses;const wr=total>0?Math.round(totalWins/total*100):0;const titles=totalKills<100?'Новобранец':totalKills<500?'Пилот':totalKills<1000?'Ветеран':totalKills<5000?'Элита':'Легенда';showModal(`<h3>📊 СТАТ</h3><button class="close-btn" onclick="hideModal()">✕</button><p>Титул: <b>${titles}</b></p><p>Боёв: ${total} (${totalWins}W / ${totalLosses}L, ${wr}%)</p><p>Убийств: ${totalKills} | Урон: ${totalDamage}</p><p>Любимый: ${favoriteRobot||'—'} (${favoriteRobotKills})</p>`);}
function openCampaign(){let h='<h3>📖 КАМПАНИЯ</h3><button class="close-btn" onclick="hideModal()">✕</button>';CAMPAIGN.missions.forEach(m=>{const can=m.id===campaignProgress;h+=`<div class="item-row"><span>${m.id}. ${m.name} ${m.id<campaignProgress?'✅':''}</span>${can?`<button onclick="startCampaignMission(${m.id})">▶</button>`:''}</div>`;});showModal(h);}
function startCampaignMission(id){const m=CAMPAIGN.missions.find(m=>m.id===id);if(!m)return;hideModal();startCampaignBattle(m);}
function startCampaignBattle(md){currentCampaignMission=md;battleMode='CAMPAIGN';campaignWave=1;enemies=[];allies=[];bullets=[];particles=[];damageNumbers=[];engineerTurrets=[];spawnPlayerRobot();if(md.type==='kill_all'){md.enemies.forEach(g=>{for(let i=0;i<(g.count||g.c||1);i++){const e=createRobotEntity(g.robot,g.mk||'MK1',g.level||g.l||1,'enemy');e.x=200+Math.random()*600;e.y=150+Math.random()*350;enemies.push(e);}});}else if(md.type==='survive_waves'){spawnCampaignWave();}else if(md.type==='defend_base'){campaignBaseHP=md.baseHP;spawnCampaignWave();}else if(md.type==='boss_fight'){const b=createRobotEntity(md.boss.robot,md.boss.mk,md.boss.level,'enemy');b.x=800;b.y=320;b.hp*=(md.boss.hpMult||1);b.maxHp*=(md.boss.hpMult||1);b.isBoss=true;enemies.push(b);}else if(md.type==='escort'){campaignEscortHP=md.escortHP;campaignEscortX=100;spawnCampaignWave();}combatActive=true;document.getElementById('surrender-btn').style.display='block';document.getElementById('combat-ui').classList.add('active');document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));updateCombatUI();canvas.focus();}
function spawnCampaignWave(){const m=currentCampaignMission;if(!m||battleMode!=='CAMPAIGN')return;if(m.type==='survive_waves'&&campaignWave>m.waves)return;if((m.type==='defend_base'||m.type==='escort')&&campaignWave>m.waves)return;const count=(m.enemiesPerWave||m.epw)?.[campaignWave-1]||3;const allowed=m.allowedEnemies||m.allowed||ALL_ROBOT_NAMES;for(let i=0;i<count;i++){const rn=allowed[Math.floor(Math.random()*allowed.length)];const e=createRobotEntity(rn,'MK1',1,'enemy');e.x=200+Math.random()*600;e.y=150+Math.random()*350;enemies.push(e);}campaignWave++;}
function campaignVictory(){if(!currentCampaignMission)return;const r=currentCampaignMission.rewards||{};if(r.silver)silver+=r.silver;if(r.gold)gold+=r.gold;if(currentCampaignMission.id===campaignProgress){campaignProgress++;if(campaignProgress>5&&!achievements.campaign)checkAchievement('campaign');}combatActive=false;showToast('🏆 Миссия пройдена!');returnToHangar();}
function campaignDefeat(){combatActive=false;showModal('<h3>ПРОВАЛ</h3><button onclick="hideModal();restartCampaignMission()">Повторить</button><button onclick="hideModal();returnToHangar()">В ангар</button>');}
function restartCampaignMission(){hideModal();if(currentCampaignMission)startCampaignBattle(currentCampaignMission);}
function generateDailyQuests(){dailyQuests=[...DAILY_QUEST_TEMPLATES].sort(()=>Math.random()-0.5).slice(0,3);dailyQuestProgress=[0,0,0];dailyQuestsCompleted=[false,false,false];lastDailyReset=Date.now();saveAccount();}
function openDailyQuests(){if(Date.now()-lastDailyReset>864e5||dailyQuests.length===0)generateDailyQuests();let h='<h3>📋 ЗАДАНИЯ</h3><button class="close-btn" onclick="hideModal()">✕</button>';dailyQuests.forEach((q,i)=>{h+=`<div class="item-row"><span>${q.desc}: ${Math.min(dailyQuestProgress[i],q.target)}/${q.target}</span>${dailyQuestsCompleted[i]?'✅':dailyQuestProgress[i]>=q.target?`<button onclick="claimDailyQuest(${i})">ЗАБРАТЬ</button>`:''}</div>`;});showModal(h);}
function updateDailyProgress(type,val){dailyQuests.forEach((q,i)=>{if(!dailyQuestsCompleted[i]&&q.type===type)dailyQuestProgress[i]=Math.min(q.target,(dailyQuestProgress[i]||0)+val);});}
function claimDailyQuest(i){if(dailyQuestsCompleted[i])return;const q=dailyQuests[i];dailyQuestsCompleted[i]=true;if(q.rSilver)silver+=q.rSilver;if(q.rGold)gold+=q.rGold;if(q.rSouls)soulCoins+=q.rSouls;saveAccount();showToast('✅ Получено!');openDailyQuests();}
function checkAchievement(name){if(achievements[name])return;achievements[name]=true;const rew={firstBlood:[100,'💰'],serialKiller:[25,'💰',5,'⭐'],berserk:[30,'💰',10,'👻'],immortal:[40,'💰',10,'👻'],collector:[500,'💰',50,'⭐'],maximist:[1000,'💰'],campaign:[300,'💰',30,'⭐'],arena:[500,'💰',50,'👻'],bossHunter:[200,'💰',20,'⭐']}[name];if(rew){silver+=rew[0]||0;if(rew[2]){if(rew[3]==='⭐')gold+=rew[2];else soulCoins+=rew[2];}}saveAccount();showToast('🏆 '+name);}
function openAchievements(){const list=[{n:'firstBlood',d:'Убить 1',r:'💰+100'},{n:'serialKiller',d:'5 за бой',r:'💰+25⭐+5'},{n:'berserk',d:'HP<20%',r:'💰+30👻+10'},{n:'immortal',d:'Не умереть',r:'💰+40👻+10'},{n:'collector',d:'10 роботов',r:'💰+500⭐+50'},{n:'maximist',d:'MK3',r:'💰+1000'},{n:'campaign',d:'5 миссий',r:'💰+300⭐+30'},{n:'arena',d:'10 волн',r:'💰+500👻+50'},{n:'bossHunter',d:'Босс',r:'💰+200⭐+20'}];let h='<h3>🏆 АЧИВКИ</h3><button class="close-btn" onclick="hideModal()">✕</button>';list.forEach(a=>{h+=`<div class="item-row"><span>${a.d}</span><span>${achievements[a.n]?'✅':a.r}</span></div>`;});showModal(h);}
function openSoulShop(){let h=`<h3>💀 МАГАЗИН ДУШ (👻${soulCoins})</h3><button class="close-btn" onclick="hideModal()">✕</button>`;const items=[{n:'Reaper',c:500,t:'robot'},{n:'Soulkeeper',c:400,t:'drone'},{n:'Aegis Guardian',c:450,t:'drone'},{n:'Scales Drone',c:500,t:'drone'},{n:'Storm Drone',c:600,t:'drone'},{n:'Scythe',c:300,t:'weapon'},{n:'Death',c:200,t:'weapon'}];items.forEach(it=>{const owned=it.t==='robot'?hangarSlots.some(s=>s.robotName===it.n):it.t==='drone'?hangarSlots.some(s=>s.drone===it.n):(parts[it.n]||0)>0;h+=`<div class="item-row"><span>${it.n}</span><span>${owned?'✅':`<button onclick="buySoulItem('${it.n}',${it.c})">${it.c}👻</button>`}</span></div>`;});showModal(h);}
function buySoulItem(name,cost){if(soulCoins<cost)return;soulCoins-=cost;if(name==='Reaper'){parts[name]=(parts[name]||0)+1;}else if(DRONES[name]){parts[name]=(parts[name]||0)+DRONES[name].parts;}else{parts[name]=(parts[name]||0)+1;}saveAccount();showToast('✅ Куплено!');openSoulShop();}
function doPrestige(){if(totalKills<5000)return;if(!confirm('ПРЕСТИЖ сбросит прогресс. Продолжить?'))return;prestigeLevel++;totalKills=0;totalWins=0;totalLosses=0;totalDamage=0;silver=500;gold=50;hangarSlots=[{robotName:'Golden Destrier',weapons:[{name:'LightCannon',mkLevel:'MK1',level:1},null],drone:null,mkLevel:'MK1',level:1,currentHp:null,modules:[null,null],pilot:null}];for(let i=1;i<5;i++)hangarSlots.push({robotName:null,weapons:[],drone:null,mkLevel:'MK1',level:1,currentHp:null,modules:[null,null],pilot:null});saveAccount();showToast('🌟 ПРЕСТИЖ '+prestigeLevel+'!');updateHangarUI();}
function startTraining(){let h='<h3>🎯 ПОЛИГОН</h3><button class="close-btn" onclick="hideModal()">✕</button><p>Цели: <button onclick="trainingConfig.count=1;startTraining()">1</button> <button onclick="trainingConfig.count=3;startTraining()">3</button> <button onclick="trainingConfig.count=5;startTraining()">5</button> (${trainingConfig.count})</p><p>Тип: <select id="train-type" onchange="trainingConfig.type=this.value">${['Манекен',...ALL_ROBOT_NAMES].map(t=>`<option ${trainingConfig.type===t?'selected':''}>${t}</option>`).join('')}</select></p><p>Стреляет: <button onclick="trainingConfig.shoots=!trainingConfig.shoots;startTraining()">${trainingConfig.shoots?'ДА':'НЕТ'}</button></p><p>💾 <button onclick="presetSlots[0]=JSON.parse(JSON.stringify(trainingConfig));showToast('Сохранено 1')">Слот 1</button> <button onclick="if(presetSlots[0]){trainingConfig=JSON.parse(JSON.stringify(presetSlots[0]));startTraining();}">Загр 1</button></p><p>💾 <button onclick="presetSlots[1]=JSON.parse(JSON.stringify(trainingConfig));showToast('Сохранено 2')">Слот 2</button> <button onclick="if(presetSlots[1]){trainingConfig=JSON.parse(JSON.stringify(presetSlots[1]));startTraining();}">Загр 2</button></p><p><button onclick="hideModal();startTrainingBattle()" class="success">▶ НАЧАТЬ</button> <button onclick="hideModal();startTrainingBattle();trainingDPS=0;trainingHitCount=0;trainingTimer=Date.now();" style="font-size:11px;">🔄 СБРОС</button></p>';showModal(h);}
function startTrainingBattle(){trainingMode=true;battleMode='TRAINING';enemies=[];allies=[];bullets=[];particles=[];damageNumbers=[];engineerTurrets=[];spawnPlayerRobot();player.hp=999999;player.maxHp=999999;player.weaponState.forEach(w=>{if(w)w.ammo=999;});for(let i=0;i<trainingConfig.count;i++){const ang=(i/trainingConfig.count)*Math.PI*2;const dist=trainingConfig.dist||300;const ex=500+Math.cos(ang)*dist;const ey=320+Math.sin(ang)*dist;let e;if(trainingConfig.type==='Манекен'){e=createRobotEntity('Destrier','MK1',1,'enemy');e.hp=999999;e.maxHp=999999;e.speed=0;}else{e=createRobotEntity(trainingConfig.type,'MK1',1,'enemy');if(!trainingConfig.shoots)e.weaponData=[];}e.x=ex;e.y=ey;enemies.push(e);}trainingTimer=Date.now();trainingDPS=0;trainingHitCount=0;combatActive=true;document.getElementById('combat-ui').classList.add('active');document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));canvas.focus();}
function createRobotEntity(name,mk,level,team){const r=ROBOTS[name]||ROBOTS['Destrier'];const wd=[],ws=[];r.slots.forEach(t=>{const f=Object.entries(WEAPONS).filter(([n,d])=>d.type===t);if(f.length){const wn=f[Math.floor(Math.random()*f.length)][0];const wo={name:wn,mkLevel:mk||'MK1',level:level||1};wd.push({...WEAPONS[wn],dmg:getWeaponDamage(wo)});ws.push({ammo:WEAPONS[wn].mag,reloading:0,cooldown:0});}else{wd.push(null);ws.push(null);}});return {robotName:name,team,x:0,y:0,radius:18,hp:getRobotStat({robotName:name,mkLevel:mk||'MK1',level:level||1},'hp'),maxHp:getRobotStat({robotName:name,mkLevel:mk||'MK1',level:level||1},'hp'),speed:getRobotStat({robotName:name,mkLevel:mk||'MK1',level:level||1},'speed'),weaponData:wd,weaponState:ws,ability:r.ability,abilityCooldown:Math.random()*300,invulnerable:0,invisTimer:0,damageBoost:1,stunned:0,color:r.color,attackCooldown:0,shootTimer:Math.random(),physicalShields:null,sonicPulseActive:false,sonicPulseTimer:0,bloodlustActive:false,bloodlustTimer:0,rebirthActive:false,rebirthTimer:0,shadowStepActive:false,shadowStepTimer:0,siegeMode:false,siegeTimer:0,damageResist:0,hitFlash:0,isBoss:false};}
function startBattle(mode){let al=-1;for(let i=0;i<hangarSlots.length;i++){if(hangarSlots[i].robotName&&(hangarSlots[i].currentHp===null||hangarSlots[i].currentHp>0)){al=i;break;}}if(al===-1){showToast('Нет живых роботов!');return;}hangarSlots.forEach(s=>{if(s.robotName)s.currentHp=Math.round(getRobotStat(s,'hp'));});battleMode=mode;currentRobotIndex=al;enemies=[];allies=[];bullets=[];particles=[];damageNumbers=[];wave=1;playerSafe=null;enemySafe=null;engineerTurrets=[];spawnPlayerRobot();if(mode==='BOSS'){const boss=createRobotEntity('Titan','MK3',10,'enemy');boss.x=800;boss.y=320;boss.hp*=20;boss.maxHp*=20;boss.isBoss=true;boss.bossMaxHp=boss.hp;enemies.push(boss);}else if(mode==='HEIST'){const owned=getOwnedRobots();playerSafe={x:150,y:320,w:30,h:50,hp:10000,maxHp:10000};enemySafe={x:850,y:320,w:30,h:50,hp:10000,maxHp:10000};for(let i=0;i<4;i++){const rn=owned[Math.floor(Math.random()*owned.length)];const a=createRobotEntity(rn,'MK1',1,'ally');a.x=200+Math.random()*200;a.y=200+Math.random()*200;allies.push(a);}for(let i=0;i<5;i++){const rn=owned[Math.floor(Math.random()*owned.length)];const e=createRobotEntity(rn,'MK1',1,'enemy');e.x=600+Math.random()*200;e.y=200+Math.random()*200;enemies.push(e);}}else if(mode==='TEAMDUEL'){const owned=getOwnedRobots();const rn=owned[Math.floor(Math.random()*owned.length)];const a=createRobotEntity(rn,'MK1',1,'ally');a.x=300;a.y=320;allies.push(a);for(let i=0;i<2;i++){const rn2=owned[Math.floor(Math.random()*owned.length)];const e=createRobotEntity(rn2,'MK1',1,'enemy');e.x=700+i*60;e.y=320+i*40;enemies.push(e);}}else if(mode==='CLEAR'){const owned=getOwnedRobots();for(let i=0;i<25;i++){const rn=owned[Math.floor(Math.random()*owned.length)];const e=createRobotEntity(rn,'MK1',5,'enemy');e.x=100+Math.random()*800;e.y=100+Math.random()*440;enemies.push(e);}}else if(mode==='SURVIVAL'){const owned=getOwnedRobots();for(let i=0;i<5;i++){const rn=owned[Math.floor(Math.random()*owned.length)];const e=createRobotEntity(rn,'MK1',1,'enemy');e.x=200+Math.random()*600;e.y=150+Math.random()*350;enemies.push(e);}}else{const owned=getOwnedRobots();for(let i=0;i<5;i++){const rn=owned[Math.floor(Math.random()*owned.length)];const e=createRobotEntity(rn,'MK1',1,'enemy');e.x=200+Math.random()*600;e.y=150+Math.random()*350;enemies.push(e);}}combatActive=true;document.getElementById('surrender-btn').style.display='block';document.getElementById('combat-ui').classList.add('active');document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));updateCombatUI();canvas.focus();}
function spawnPlayerRobot(){const s=hangarSlots[currentRobotIndex];if(!s||!s.robotName)return;const r=ROBOTS[s.robotName];let spd=getRobotStat(s,'speed'),maxHp=getRobotStat(s,'hp'),dmgBoost=1,selfHeal=0;if(s.drone==='Octanian')spd*=1.15;s.modules?.forEach(m=>{if(m&&m.name==='Mechanic')selfHeal+=0.005*(m.level||1);});if(s.pilot){s.pilot.skills?.forEach(sk=>{if(sk.includes('Road Hog'))spd*=1.06;if(sk.includes('Armor Expert'))maxHp*=1.06;if(sk.includes('Master Gunsmith'))dmgBoost*=1.022;});}const weaponData=s.weapons.filter(w=>w&&w.name).map(w=>({...WEAPONS[w.name],dmg:WEAPONS[w.name]?.dmg||10}));player={x:500,y:500,radius:18,hp:maxHp,maxHp,speed:Math.min(6.5,spd),robotName:s.robotName,weaponData,weaponState:s.weapons.filter(w=>w&&w.name).map(w=>({ammo:WEAPONS[w.name]?.mag||20,reloading:0,cooldown:0})),ability:r.ability,abilityCooldown:0,invulnerable:0,invisTimer:0,damageBoost:dmgBoost,stunned:0,selfHeal,team:'player',physicalShields:null,sonicPulseActive:false,shadowStepActive:false,siegeMode:false,siegeTimer:0,damageResist:0,hitFlash:0,pilot:s.pilot};}
function switchRobotDirection(dir){if(combatActive){const living=hangarSlots.filter(s=>s.robotName&&(s.currentHp===null||s.currentHp>0));if(living.length<=1)return;const idx=living.indexOf(hangarSlots[currentRobotIndex]);if(idx===-1)return;const newIdx=dir==='prev'?(idx-1+living.length)%living.length:(idx+1)%living.length;switchRobotInBattle(hangarSlots.indexOf(living[newIdx]));}else{selectedSlot=dir==='prev'?(selectedSlot-1+hangarSlots.length)%hangarSlots.length:(selectedSlot+1)%hangarSlots.length;updateHangarUI();}}
function switchRobotInBattle(idx){if(!combatActive||idx===currentRobotIndex)return;const s=hangarSlots[idx];if(!s.robotName||(s.currentHp!==null&&s.currentHp<=0))return;currentRobotIndex=idx;spawnPlayerRobot();}
function useEntityAbility(entity,tx,ty){if(!entity||entity.abilityCooldown>0||!entity.ability||entity.stunned>0)return;let cd=180;const a=entity.ability;if(a==='Blink'){const ang=Math.atan2(ty-entity.y,tx-entity.x);entity.x+=Math.cos(ang)*180;entity.y+=Math.sin(ang)*180;cd=180;}else if(a==='Heal Pulse'){const targs=entity.team==='player'?[...allies,player]:[...enemies];targs.forEach(e=>{if(e&&Math.hypot(e.x-entity.x,e.y-entity.y)<300){e.hp=Math.min(e.maxHp,e.hp+e.maxHp*(entity.pilot?.name==='Dr. Mercy'?0.3:0.2));if(entity.pilot?.name==='Dr. Mercy')e.invulnerable=60;}});cd=600;}else if(a==='Siege Mode'){entity.siegeMode=true;entity.siegeTimer=480;entity.speed=0;entity.damageResist=0.3;entity.damageBoost*=1.2;cd=1200;}else if(a==='Build Turret'){if(engineerTurrets.length>=2)engineerTurrets.shift();const turret={x:entity.x+30,y:entity.y,hp:entity.pilot?.name==='Gear Master'?1200:800,maxHp:entity.pilot?.name==='Gear Master'?1200:800,dmg:entity.pilot?.name==='Gear Master'?25:20,range:400,team:entity.team};engineerTurrets.push(turret);cd=900;}else if(a==='Shadow Step'){entity.invisTimer=entity.pilot?.name==='Shade Walker'?420:300;entity.damageBoost=2.5;entity.shadowStepActive=true;entity.shadowStepTimer=180;cd=1200;}entity.abilityCooldown=cd;updateDailyProgress('abilities',1);}
function entityShoot(entity,tx,ty){if(!entity||entity.stunned>0)return;entity.weaponState.forEach((ws,i)=>{if(!ws||ws.reloading>0||ws.ammo<=0)return;const wd=entity.weaponData[i];if(!wd)return;ws.cooldown=wd.cooldown;ws.ammo--;const ang=Math.atan2(ty-entity.y,tx-entity.x);const b={x:entity.x+Math.cos(ang)*(entity.radius+8),y:entity.y+Math.sin(ang)*(entity.radius+8),vx:Math.cos(ang)*10,vy:Math.sin(ang)*10,damage:wd.dmg*(entity.damageBoost||1),range:wd.range,traveled:0,radius:3.5,hit:false,color:wd.color||'#fff',isEnemy:entity.team==='enemy',shooter:entity,effect:wd.effect};bullets.push(b);});}
function entityAI(entity){if(!entity||entity.stunned>0)return;if(battleMode==='HEIST'&&entity.team==='enemy'){if(enemySafe&&enemySafe.hp>0&&Math.hypot(entity.x-enemySafe.x,entity.y-enemySafe.y-20)<100&&Math.random()<0.3)enemySafe.hp-=10;else if(playerSafe&&playerSafe.hp>0&&Math.hypot(entity.x-playerSafe.x,entity.y-playerSafe.y-20)<100)playerSafe.hp-=10;}if(entity.team==='ally'&&battleMode==='HEIST'&&enemySafe&&enemySafe.hp>0){if(Math.hypot(entity.x-enemySafe.x,entity.y-enemySafe.y-20)<80)enemySafe.hp-=20;}const targets=entity.team==='enemy'?[player,...allies]:enemies.filter(t=>t&&t.hp>0);if(!targets.length)return;let nearest=null,nd=Infinity;targets.forEach(t=>{if(!t||!t.x)return;const d=Math.hypot(t.x-entity.x,t.y-entity.y);if(d<nd){nd=d;nearest=t;}});if(!nearest||!nearest.x)return;const dx=nearest.x-entity.x,dy=nearest.y-entity.y,dist=nd;entity.shootTimer-=1/60;if(dist<350&&dist>50&&entity.shootTimer<=0){entity.shootTimer=0.5;entityShoot(entity,nearest.x,nearest.y);}if(dist<160){entity.x-=(dx/dist)*entity.speed;entity.y-=(dy/dist)*entity.speed;}else if(dist>350){entity.x+=(dx/dist)*entity.speed;entity.y+=(dy/dist)*entity.speed;}entity.x=Math.max(15,Math.min(985,entity.x));entity.y=Math.max(15,Math.min(625,entity.y));}
function updateEntity(entity){if(!entity||entity.hp<=0)return;if(entity.stunned>0){entity.stunned--;return;}if(entity.abilityCooldown>0)entity.abilityCooldown--;if(entity.invisTimer>0)entity.invisTimer--;if(entity.shadowStepTimer>0){entity.shadowStepTimer--;if(entity.shadowStepTimer<=0)entity.damageBoost=1;}if(entity.siegeMode){entity.siegeTimer--;if(entity.siegeTimer<=0){entity.siegeMode=false;entity.speed=getRobotStat(hangarSlots[currentRobotIndex],'speed')||2.5;entity.damageResist=-0.1;setTimeout(()=>{if(entity)entity.damageResist=0;},2000);}}if(entity.hitFlash>0)entity.hitFlash--;entity.weaponState.forEach(ws=>{if(ws&&ws.reloading>0){ws.reloading-=1/60;if(ws.reloading<=0)ws.ammo=entity.weaponData[entity.weaponState.indexOf(ws)]?.mag||20;}});}
function updateCombat(){if(!combatActive||!player)return;updateEntity(player);if(autoBattle)entityAI(player);let dx=0,dy=0;if(!autoBattle&&player.stunned<=0){if(keys['w'])dy-=1;if(keys['s'])dy+=1;if(keys['a'])dx-=1;if(keys['d'])dx+=1;if(dx||dy){const len=Math.hypot(dx,dy);player.x+=(dx/len)*Math.min(player.speed,5.5);player.y+=(dy/len)*Math.min(player.speed,5.5);player.x=Math.max(15,Math.min(985,player.x));player.y=Math.max(15,Math.min(625,player.y));}if(mouseDown)entityShoot(player,mouseX,mouseY);}
  [...enemies].forEach(e=>{updateEntity(e);entityAI(e);});[...allies].forEach(a=>{updateEntity(a);entityAI(a);});
  engineerTurrets.forEach(t=>{if(t.hp>0&&enemies.length>0){let nearest=null,nd=Infinity;enemies.forEach(e=>{const d=Math.hypot(e.x-t.x,e.y-t.y);if(d<nd){nd=d;nearest=e;}});if(nearest&&nd<t.range)nearest.hp-=t.dmg/60;}});
  bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.traveled+=Math.hypot(b.vx,b.vy);if(b.x<0||b.x>1000||b.y<0||b.y>640)b.hit=true;});
  bullets.forEach(b=>{if(b.hit)return;const targets=b.isEnemy?[player,...allies]:enemies;for(let e of targets){if(!e||e.hp<=0||Math.hypot(b.x-e.x,b.y-e.y)>=e.radius+b.radius+3)continue;let dmg=b.damage*(1-(e.damageResist||0));if(e.physicalShields)continue;e.hp-=dmg;totalDamage+=dmg;e.hitFlash=3;if(b.effect==='plasma_burn')e.fire={dps:10,timer:120};b.hit=true;damageNumbers.push({x:b.x,y:b.y,text:'-'+Math.round(dmg),life:30,color:'#fff'});if(trainingMode){trainingHitCount++;trainingDPS+=dmg;}break;}});
  if(battleMode==='HEIST'&&playerSafe&&enemySafe){if(playerSafe.hp>0&&player.hp>0&&Math.hypot(player.x-enemySafe.x,player.y-enemySafe.y-20)<80)enemySafe.hp-=50/60;if(Math.random()<0.05&&enemies.some(e=>e.hp>0&&Math.hypot(e.x-playerSafe.x,e.y-playerSafe.y-20)<80))playerSafe.hp-=10;}
  bullets=bullets.filter(b=>!b.hit&&b.traveled<b.range);
  damageNumbers=damageNumbers.filter(d=>{d.life--;return d.life>0;});
  const deadEnemies=enemies.filter(e=>e.hp<=0);deadEnemies.forEach(e=>{const earned=e.isBoss?100:15;silver+=earned;totalKills++;killCount++;updateDailyChallengeProgress(1);robotKillCounts[player.robotName]=(robotKillCounts[player.robotName]||0)+1;if(robotKillCounts[player.robotName]>favoriteRobotKills){favoriteRobot=player.robotName;favoriteRobotKills=robotKillCounts[player.robotName];}if(totalKills===1&&!achievements.firstBlood)checkAchievement('firstBlood');if(killCount>=5&&!achievements.serialKiller)checkAchievement('serialKiller');updateDailyProgress('kills',1);particles.push({x:e.x,y:e.y,life:20});});
  enemies=enemies.filter(e=>e.hp>0);
  if(battleMode==='BOSS'&&enemies.length>0){const boss=enemies[0];if(boss.hp<boss.bossMaxHp*0.25)boss.bossPhase=3;else if(boss.hp<boss.bossMaxHp*0.5)boss.bossPhase=2;}
  if(enemies.length===0&&battleMode==='SURVIVAL'){wave++;const owned=getOwnedRobots();for(let i=0;i<3+wave*2;i++){const rn=owned[Math.floor(Math.random()*owned.length)];const e=createRobotEntity(rn,'MK1',Math.min(12,wave),'enemy');e.x=200+Math.random()*600;e.y=150+Math.random()*350;e.hp*=1+wave*0.1;e.maxHp*=1+wave*0.1;enemies.push(e);}showToast('🌊 Волна '+wave+'!');}
  if(enemies.length===0&&battleMode==='ARENA'){wave++;const owned=getOwnedRobots();for(let i=0;i<wave*3;i++){const rn=owned[Math.floor(Math.random()*owned.length)];const e=createRobotEntity(rn,'MK1',Math.min(12,wave+2),'enemy');e.x=200+Math.random()*600;e.y=150+Math.random()*350;enemies.push(e);}if(wave%5===0){const leg=Object.entries(ROBOTS).filter(([n,d])=>d.legendary);if(leg.length){const[bn]=leg[Math.floor(Math.random()*leg.length)];const b=createRobotEntity(bn,'MK2',Math.min(12,wave),'enemy');b.x=700;b.y=320;b.hp*=3;b.maxHp*=3;enemies.push(b);}}if(wave>=10&&!achievements.arena)checkAchievement('arena');}
  if(battleMode==='HEIST'&&playerSafe&&enemySafe){if(enemySafe.hp<=0){gameOver(true,'Сейф взломан!');silver+=1000;gold+=50;}if(playerSafe.hp<=0){gameOver(false,'Сейф уничтожен!');silver+=200;}}
  if(player.hp<=0){let found=false;for(let i=0;i<hangarSlots.length;i++){const idx=(currentRobotIndex+i+1)%hangarSlots.length;if(hangarSlots[idx].robotName&&hangarSlots[idx].currentHp>0){currentRobotIndex=idx;spawnPlayerRobot();found=true;break;}}if(!found&&battleMode!=='CAMPAIGN'&&battleMode!=='ARENA'&&battleMode!=='HEIST'&&!trainingMode)gameOver(false);}
  if(battleMode==='CAMPAIGN'&&currentCampaignMission){if(currentCampaignMission.type==='kill_all'&&enemies.length===0)campaignVictory();if(player.hp<=0)campaignDefeat();}
  if(trainingMode){const elapsed=(Date.now()-trainingTimer)/1000;if(elapsed>0)document.getElementById('hud').innerHTML=`🎯 DPS: ${Math.round(trainingDPS/elapsed)} | Попаданий: ${trainingHitCount} | Время: ${Math.floor(elapsed)}сек <button onclick="returnToHangar();trainingMode=false;" style="pointer-events:auto;font-size:10px;">В АНГАР</button>`;}
  updateCombatUI();saveAccount();}
let killCount=0;
function gameOver(v,msg){combatActive=false;killCount=0;document.getElementById('surrender-btn').style.display='none';document.getElementById('gameover-panel').style.display='block';document.getElementById('gameover-text').textContent=msg||(v?'ПОБЕДА!':'ПОРАЖЕНИЕ');if(v){totalWins++;const bonus=prestigeLevel*0.1;silver+=200+Math.floor(200*bonus);updateDailyProgress('wins',1);if(player.hp<player.maxHp*0.2&&!achievements.berserk)checkAchievement('berserk');if(!playerDied&&!achievements.immortal)checkAchievement('immortal');}else{totalLosses++;}if(battleMode==='BOSS'&&v&&!achievements.bossHunter)checkAchievement('bossHunter');saveAccount();}
function returnToHangar(){combatActive=false;trainingMode=false;document.getElementById('gameover-panel').style.display='none';hangarSlots.forEach(s=>{if(s.robotName)s.currentHp=Math.round(getRobotStat(s,'hp'));});showHangar();}
function restartBattle(){returnToHangar();startBattle(battleMode);}
function surrender(){gameOver(false,'Вы сдались');}
function updateCombatUI(){if(!player)return;const hpP=Math.max(0,(player.hp/player.maxHp)*100);document.getElementById('robot-info').innerHTML=`<b>${player.robotName}</b><br><div class="health-bar"><div class="health-fill ${hpP<30?'low':''}" style="width:${hpP}%"></div></div><small>${Math.round(player.hp)}/${player.maxHp}</small>`;}
function drawRobotShape(entity,isPlayer){if(!entity||!entity.radius)return;const x=entity.x,y=entity.y;ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(0,entity.radius+2,entity.radius*0.8,4,0,0,Math.PI*2);ctx.fill();let angle=isPlayer?Math.atan2(mouseY-y,mouseX-x):0;ctx.rotate(angle);if(entity.hitFlash>0){ctx.fillStyle='rgba(255,255,255,0.5)';ctx.beginPath();ctx.arc(0,0,entity.radius,0,Math.PI*2);ctx.fill();}ctx.fillStyle=entity.color;ctx.strokeStyle='#fff';ctx.lineWidth=2;if(entity.robotName==='Engineer'){ctx.fillStyle='#88aa44';ctx.fillRect(-12,-12,24,24);ctx.strokeRect(-12,-12,24,24);ctx.fillStyle='#ffdd00';ctx.fillRect(-2,8,4,8);}else if(entity.robotName==='Golden Destrier'){ctx.fillStyle='#ffd700';ctx.fillRect(-10,-10,20,20);ctx.strokeRect(-10,-10,20,20);}else {ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();ctx.stroke();}if(entity.weaponData&&entity.weaponData.length){entity.weaponData.forEach(wd=>{if(!wd)return;const ang2=isPlayer?Math.atan2(mouseY-y,mouseX-x):0;const wpX=Math.cos(ang2)*(entity.radius+12);const wpY=Math.sin(ang2)*(entity.radius+12);ctx.fillStyle=wd.color||'#fff';ctx.beginPath();ctx.arc(wpX,wpY,3,0,Math.PI*2);ctx.fill();});}ctx.restore();}
function drawBattle(){ctx.clearRect(0,0,1000,640);ctx.fillStyle='#0a0a14';ctx.fillRect(0,0,1000,640);if(!combatActive)return;if(playerSafe){ctx.fillStyle='#4488ff';ctx.fillRect(playerSafe.x,playerSafe.y,playerSafe.w,playerSafe.h);}if(enemySafe){ctx.fillStyle='#ff4444';ctx.fillRect(enemySafe.x,enemySafe.y,enemySafe.w,enemySafe.h);}enemies.forEach(e=>{drawRobotShape(e,false);ctx.fillStyle='#ff6644';ctx.fillRect(e.x-15,e.y-e.radius-12,30*Math.max(0,e.hp/e.maxHp),5);});allies.forEach(a=>{drawRobotShape(a,false);});if(player){drawRobotShape(player,true);ctx.fillStyle=(player.hp/player.maxHp)<0.3?'#f34':'#4c6';ctx.fillRect(player.x-25,player.y-player.radius-16,50*Math.max(0,player.hp/player.maxHp),6);}engineerTurrets.forEach(t=>{if(t.hp>0){ctx.fillStyle='#88aa44';ctx.fillRect(t.x-8,t.y-8,16,16);ctx.fillStyle='#44cc66';ctx.fillRect(t.x-10,t.y-12,20*Math.max(0,t.hp/t.maxHp),3);}});bullets.forEach(b=>{ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);ctx.fill();});damageNumbers.forEach(dn=>{if(dn.life>0){ctx.fillStyle=dn.color;ctx.font='bold 14px sans-serif';ctx.fillText(dn.text,dn.x,dn.y-dn.life/2);}});}
function mainLoop(){if(combatActive){updateCombat();drawBattle();}requestAnimationFrame(mainLoop);}
document.addEventListener('DOMContentLoaded',()=>{const s=localStorage.getItem('wr1.37f2');if(s)try{accounts=JSON.parse(s);}catch(e){}document.getElementById('btn-login').addEventListener('click',()=>{const n=document.getElementById('login-name').value.trim();if(!n||!accounts[n])return;if(loadAccount(n))showHangar();});document.getElementById('btn-register').addEventListener('click',()=>{const n=document.getElementById('reg-name').value.trim();if(!n||accounts[n])return;accounts[n]={};initNewAccount(n);showHangar();});document.getElementById('btn-guest').addEventListener('click',()=>{const n='Guest_'+Math.floor(Math.random()*9000);accounts[n]={};initNewAccount(n);showHangar();});window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;canvas.focus();if(!combatActive){if(e.key==='1'||e.key==='z')switchRobotDirection('prev');if(e.key==='2'||e.key==='x')switchRobotDirection('next');}if(combatActive&&e.key==='e'&&!abilityUsedThisPress){abilityUsedThisPress=true;useEntityAbility(player,mouseX,mouseY);}});window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key==='e')abilityUsedThisPress=false;});canvas.addEventListener('mousemove',e=>{mouseX=e.clientX-canvas.getBoundingClientRect().left;mouseY=e.clientY-canvas.getBoundingClientRect().top;});canvas.addEventListener('mousedown',()=>mouseDown=true);canvas.addEventListener('mouseup',()=>mouseDown=false);showScreen('login-screen');canvas.focus();requestAnimationFrame(mainLoop);});
function toggleAutoBattle(){autoBattle=!autoBattle;document.getElementById('auto-battle-btn').textContent=autoBattle?'🤖 Стоп':'🤖 Авто-бой';if(autoBattle&&!combatActive)startBattle('TDM');}
</script>
