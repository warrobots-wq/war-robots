    .tab { display: flex; gap: 10px; margin-bottom: 15px; } .tab-btn { padding: 8px 20px; cursor: pointer; background: #222; border: 1px solid var(--border); border-radius: 5px 5px 0 0; } .tab-btn.active { background: var(--accent); } .tab-content { display: none; } .tab-content.active { display: block; }

    .modal { background: #1a1a2e; border: 2px solid var(--accent); border-radius: 10px; padding: 20px; max-width: 520px; max-height: 460px; overflow-y: auto; color: white; } .modal h3 { color: var(--gold); margin-bottom: 10px; }

function generateDailyQuests() {
  const shuffled = [...DAILY_QUEST_TEMPLATES].sort(()=>Math.random()-0.5);
  dailyQuests = shuffled.slice(0,3);
  dailyQuestProgress = [0,0,0]; dailyQuestsCompleted = [false,false,false];
  lastDailyReset = Date.now(); saveAccount();
}
function openDailyQuests() {
  if (Date.now() - lastDailyReset > 86400000) generateDailyQuests();
  if (dailyQuests.length === 0) generateDailyQuests();
  let h = '<h3>📋 ЕЖЕДНЕВНЫЕ ЗАДАНИЯ</h3><button class="close-btn" onclick="hideModal()">✕</button>';
  dailyQuests.forEach((q,i)=>{
    const prog = dailyQuestProgress[i]; const done = dailyQuestsCompleted[i];
    h += `<div class="item-row" style="flex-direction:column;align-items:flex-start;"><b>${q.desc}</b><small>${Math.min(prog,q.target)}/${q.target}</small>${done?'<span style="color:var(--success);">✅ Забрать</span>':prog>=q.target?'<button onclick="claimDailyQuest('+i+')">Забрать</button>':''}</div>`;
  }); showModal(h);
}
function claimDailyQuest(i) {
  if (dailyQuestsCompleted[i]) return;
  const q = dailyQuests[i]; dailyQuestsCompleted[i] = true;
  if (q.rewardSilver) silver += q.rewardSilver;
  if (q.rewardGold) gold += q.rewardGold;
  if (q.rewardSouls) soulCoins += q.rewardSouls;
  if (q.rewardParts) { const items = Object.keys(ROBOTS).filter(r=>!ROBOTS[r].legendary&&r!=='Reaper'); if(items.length) parts[items[Math.floor(Math.random()*items.length)]]+=q.rewardParts; }
  saveAccount(); updateHangarUI(); showToast('✅ Награда получена!');
}

function updateDailyProgress(type, val) {
  dailyQuests.forEach((q,i)=>{ if (!dailyQuestsCompleted[i] && q.type === type) dailyQuestProgress[i] = Math.min(q.target, (dailyQuestProgress[i]||0)+val); });
}

function getWeaponDamage(weaponObj) { if (!weaponObj || !weaponObj.name) return 0; const base = WEAPONS[weaponObj.name]?.dmg || 0; const mk = weaponObj.mkLevel || 'MK1'; const lvl = weaponObj.level || 1; const mults = { 'MK1': [1.00,1.05,1.10,1.15,1.20,1.25,1.30,1.35,1.40,1.45,1.50,1.55], 'MK2': [1.75,1.80,1.85,1.90,1.95,2.00,2.05,2.10,2.15,2.20,2.25,2.30], 'MK3': [2.50] }; return Math.round(base * (mults[mk]?.[Math.min(lvl-1, (mults[mk]?.length||1)-1)] || 1)); }

obot()" class="gold">Улучшить робота</button><button onclick="maxUpgradeRobot()" class="gold" style="font-size:11px;">⚡ MAX (MK3)</button><button onclick="openRobotSelectionModal()">Сменить</button>`; }
function assignPilot() { const s = hangarSlots[selectedSlot]; if (!s.robotName || !PILOTS[s.robotName]) return; const pdef = PILOTS[s.robotName]; const skills = []; const pool = [...RANDOM_SKILLS]; for (let i = 0; i < 2; i++) { const idx = Math.floor(Math.random() * pool.length); skills.push(pool.splice(idx, 1)[0]); } s.pilot = { name: pdef.name, uniqueSkill: pdef.uniqueSkill, skills }; saveAccount(); updateHangarUI(); }

function upgradeWeapon(idx) { const s = hangarSlots[selectedSlot]; if (!s || !s.weapons[idx] || !s.weapons[idx].name) return; const w = s.weapons[idx]; const cost = getWeaponUpgradeCost(w); if (!cost) return; if (cost.type === 'level') { if (silver < cost.cost) return; silver -= cost.cost; w.level++; } else if (cost.type === 'mk2') { if (gold < cost.cost) return; gold -= cost.cost; w.mkLevel = 'MK2'; w.level = 1; } else if (cost.type === 'mk3') { if (gold < cost.costGold || silver < cost.costSilver) return; gold -= cost.costGold; silver -= cost.costSilver; w.mkLevel = 'MK3'; w.level = 1; } saveAccount(); updateHangarUI(); }

function maxUpgradeRobot() { const s = hangarSlots[selectedSlot]; if (!s.robotName) return; let totalSilver=0, totalGold=0; while(s.mkLevel!=='MK3'){ if(s.mkLevel==='MK1'&&s.level<12){while(s.level<12){s.level++; totalSilver+=s.level*50+100;}} else if(s.mkLevel==='MK1'&&s.level>=12){totalGold+=1000; s.mkLevel='MK2'; s.level=1;} else if(s.mkLevel==='MK2'&&s.level<12){while(s.level<12){s.level++; totalSilver+=s.level*50+100;}} else if(s.mkLevel==='MK2'&&s.level>=12){totalGold+=2000; totalSilver+=5000; s.mkLevel='MK3'; s.level=1;} else break; } if(silver<totalSilver||gold<totalGold){showToast('Недостаточно ресурсов'); return;} silver-=totalSilver; gold-=totalGold; s.mkLevel='MK3'; s.level=1; saveAccount(); updateHangarUI(); showToast('⚡ Робот прокачан до MK3!'); }

function drawBattle() {
  ctx.clearRect(0,0,1000,640); ctx.fillStyle=nightMode?'#000005':'#0a0a14'; ctx.fillRect(0,0,1000,640);
  for(let x=0;x<1000;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,640);ctx.strokeStyle='#1a1a2e';ctx.stroke();}
  for(let y=0;y<640;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1000,y);ctx.stroke();}
  ctx.globalAlpha=0.5; OBSTACLES.forEach(o=>{ctx.fillStyle='#334';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle='#f00';ctx.strokeRect(o.x,o.y,o.w,o.h);}); ctx.globalAlpha=1;
  if(!combatActive)return;
  if(battleMode==='CONVOY'){convoyTrucks.forEach(t=>{if(!t.saved&&t.hp>0){ctx.fillStyle='#4488ff';ctx.fillRect(t.x-15,t.y-10,30,20);ctx.strokeStyle='#fff';ctx.strokeRect(t.x-15,t.y-10,30,20);ctx.fillStyle='#fff';ctx.font='bold 8px sans-serif';ctx.textAlign='center';ctx.fillText('CONVOY',t.x,t.y-12);ctx.fillStyle='#000';ctx.fillRect(t.x-20,t.y-15,40,4);ctx.fillStyle='#44cc66';ctx.fillRect(t.x-20,t.y-15,40*Math.max(0,t.hp/t.maxHp),4);}});}
  allies.forEach(a=>{ if(a.robotName==='Healing Ward'){ctx.fillStyle='#8B0000';ctx.fillRect(a.x-10,a.y-10,20,20);} else {drawRobotShape(a,false); ctx.fillStyle='#44cc66';ctx.fillRect(a.x-15,a.y-a.radius-12,30*Math.max(0,a.hp/a.maxHp),5);} });
  enemies.forEach(e=>{ if(!e||e.hp<=0)return; drawRobotShape(e,false); ctx.fillStyle='#ff6644';ctx.fillRect(e.x-15,e.y-e.radius-12,30*Math.max(0,e.hp/e.maxHp),5); });
  if(player){ drawRobotShape(player,true); ctx.fillStyle=(player.hp/player.maxHp)<0.3?'#ff3344':'#44cc66'; ctx.fillRect(player.x-25,player.y-player.radius-16,50*Math.max(0,player.hp/player.maxHp),6); }

function setupEventListeners() {
  document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));document.getElementById('tab-'+b.dataset.tab).classList.add('active');}));
  document.getElementById('btn-login').addEventListener('click',()=>{const n=document.getElementById('login-name').value.trim(),p=document.getElementById('login-pass').value;if(!n||!p)return;if(!accounts[n]||accounts[n].password!==p)return;if(loadAccount(n))showHangar();});
  document.getElementById('btn-register').addEventListener('click',()=>{const n=document.getElementById('reg-name').value.trim(),p=document.getElementById('reg-pass').value,p2=document.getElementById('reg-pass2').value;if(n.length<3||p.length<4||p!==p2||accounts[n])return;accounts[n]={password:p};localStorage.setItem('warRobots_v1.35',JSON.stringify(accounts));initNewAccount(n);saveAccount();showHangar();});
  document.getElementById('btn-guest').addEventListener('click',()=>{const gn='Guest_'+Math.floor(Math.random()*9000+1000);accounts[gn]={password:''};localStorage.setItem('warRobots_v1.35',JSON.stringify(accounts));initNewAccount(gn);showHangar();});
  document.getElementById('modal-overlay').addEventListener('click',function(e){if(e.target===this)hideModal();});
}

document.addEventListener('DOMContentLoaded', () => {
  isMobile=/Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent)||('ontouchstart' in window&&window.innerWidth<1024);
  const s=localStorage.getItem('warRobots_v1.35');if(s)try{accounts=JSON.parse(s);}catch(e){accounts={};}
  setupEventListeners();
  window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys[e.key.toLowerCase()]=true;controlLostFrames=0;canvas.focus();
    if(!combatActive&&document.getElementById('hangar-screen').classList.contains('active')){if(e.key>='1'&&e.key<='9'){const idx=parseInt(e.key)-1;if(idx<hangarSlots.length){selectedSlot=idx;updateHangarUI();}}}
    if(combatActive&&player&&player.stunned<=0){if(e.key.toLowerCase()==='e'){e.preventDefault();if(!abilityUsedThisPress){abilityUsedThisPress=true;useEntityAbility(player,mouseX,mouseY);}}if(e.key.toLowerCase()==='r'){e.preventDefault();reloadAll();}}
    if(combatActive&&(e.key==='1'||e.key.toLowerCase()==='z')){e.preventDefault();switchRobotDirection('prev');}
    if(combatActive&&(e.key==='2'||e.key.toLowerCase()==='x')){e.preventDefault();switchRobotDirection('next');}
    if(e.key==='Escape')hideModal();
  });
  window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key.toLowerCase()==='e')abilityUsedThisPress=false;});
  canvas.addEventListener('mousemove',e=>{mouseX=e.clientX-canvas.getBoundingClientRect().left;mouseY=e.clientY-canvas.getBoundingClientRect().top;controlLostFrames=0;});
  canvas.addEventListener('mousedown',e=>{if(e.button===0)mouseDown=true;controlLostFrames=0;});
  canvas.addEventListener('mouseup',e=>{if(e.button===0)mouseDown=false;});
  canvas.addEventListener('focus',()=>{canvasHasFocus=true;}); canvas.addEventListener('blur',()=>{canvasHasFocus=false;});
  showLogin(); canvas.focus(); requestAnimationFrame(mainLoop);
});
window.onload=()=>{canvas.focus();window.focus();};
</script>
</body>
</html>
