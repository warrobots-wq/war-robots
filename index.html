<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, touch-action: manipulation">
    <title>War Robots – Версия 26 (Soul Harvester)</title>
    <style>
        :root {
            --bg: #0a0a14; --panel: #111122; --border: #334;
            --gold: #ffd700; --silver: #c0c0c0; --accent: #4477ff;
            --danger: #ff3344; --success: #44cc66; --team: #4488ff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none;
            touch-action: manipulation;
        }
        #app {
            width: 1000px; height: 700px; background: var(--panel);
            border: 2px solid var(--border); border-radius: 12px;
            position: relative; overflow: hidden; color: #ddd;
            touch-action: manipulation;
        }
        canvas { display: block; outline: none; }
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; justify-content: center; align-items: center; z-index: 5;
        }
        .screen.active { display: flex; }
        .panel {
            background: rgba(0,0,0,0.85); border: 1px solid var(--border);
            border-radius: 8px; padding: 15px; margin: 5px;
        }
        button {
            background: var(--accent); color: white; border: none;
            padding: 8px 16px; border-radius: 5px; cursor: pointer;
            font-size: 14px; transition: 0.2s; margin: 3px;
        }
        button:hover { filter: brightness(1.2); }
        button.gold { background: #b8960c; }
        button.danger { background: var(--danger); }
        button.success { background: var(--success); }
        button.team { background: var(--team); }
        input {
            background: #1a1a2e; border: 1px solid var(--border); color: white;
            padding: 8px; border-radius: 4px; margin: 4px 0; width: 220px; font-size: 14px;
        }
        input:focus { outline: none; border-color: var(--accent); }
        .tab { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn {
            padding: 8px 20px; cursor: pointer; background: #222;
            border: 1px solid var(--border); border-radius: 5px 5px 0 0;
        }
        .tab-btn.active { background: var(--accent); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        #hud {
            position: absolute; top: 5px; left: 5px; color: white;
            font-size: 12px; pointer-events: none; z-index: 10;
        }
        #combat-ui {
            position: absolute; bottom: 0; left: 0; right: 0;
            display: none; z-index: 10; pointer-events: none;
            padding: 6px 10px; background: rgba(0,0,0,0.85);
        }
        #combat-ui.active {
            display: flex; justify-content: space-between;
            align-items: flex-end; gap: 8px; flex-wrap: wrap;
        }
        .health-bar {
            width: 180px; height: 10px; background: #333;
            border-radius: 5px; overflow: hidden; margin: 2px 0;
        }
        .health-fill { height: 100%; background: var(--success); transition: width 0.3s; }
        .health-fill.low { background: var(--danger); }
        .weapon-indicator {
            background: rgba(0,0,0,0.7); color: #fff; padding: 5px 10px;
            border-radius: 4px; font-size: 11px; pointer-events: auto; white-space: nowrap;
        }
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; justify-content: center;
            align-items: center; z-index: 50;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #1a1a2e; border: 2px solid var(--accent);
            border-radius: 10px; padding: 20px; max-width: 520px;
            max-height: 460px; overflow-y: auto; color: white;
        }
        .modal h3 { color: var(--gold); margin-bottom: 10px; }
        .modal .item-row {
            padding: 6px; cursor: pointer; border-radius: 4px;
            margin: 2px 0; display: flex; justify-content: space-between;
        }
        .modal .item-row:hover { background: rgba(68,119,255,0.3); }
        .modal .item-row.locked { color: #888; cursor: not-allowed; }
        .modal .close-btn {
            float: right; background: var(--danger); font-size: 12px; padding: 4px 10px;
        }
        #gameover-panel {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%,-50%); z-index: 20; text-align: center;
        }
        #toast-container {
            position: absolute; top: 40px; right: 10px; z-index: 15; pointer-events: none;
        }
        .toast {
            background: rgba(0,0,0,0.85); color: #ffd700; padding: 5px 12px;
            margin: 4px; border-radius: 4px; font-size: 13px;
            animation: toastAnim 2.0s forwards;
        }
        @keyframes toastAnim {
            0% { opacity: 0; transform: translateX(30px); }
            15% { opacity: 1; transform: translateX(0); }
            70% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(30px); }
        }
        #owner-code-area {
            position: absolute; top: 5px; left: 200px; display: flex; gap: 5px; z-index: 20;
        }
        #owner-code-input { width: 120px; padding: 4px; font-size: 12px; }
        #mobile-controls {
            display: none; position: absolute; top:0; left:0; width:100%; height:100%;
            pointer-events: none; z-index: 25;
        }
        .mobile-btn {
            pointer-events: auto; background: rgba(68,119,255,0.6);
            border: 2px solid rgba(255,255,255,0.3); color: white;
            font-weight: bold; display: flex; align-items: center; justify-content: center;
        }
        #mobile-code-pad {
            display: none; position: absolute; top: 28px; left: 0;
            z-index: 30; background: rgba(0,0,0,0.9); padding: 6px;
            border-radius: 8px; border: 1px solid #555;
        }
    </style>
</head>
<body>
<div id="app">
    <canvas id="gameCanvas" width="1000" height="640" tabindex="0"></canvas>
    <div id="hud"></div>
    <div id="combat-ui">
        <div id="robot-info"></div>
        <div id="weapon-info" class="weapon-indicator"></div>
        <div id="ability-info" class="weapon-indicator"></div>
    </div>
    <div id="toast-container"></div>

    <div id="mobile-controls">

    <div id="login-screen" class="screen active">
        <div class="panel" style="min-width:360px;">
            <h2 style="color:var(--gold);text-align:center;">WAR ROBOTS</h2>
            <div class="tab">
                <div class="tab-btn active" data-tab="login">ВХОД</div>
                <div class="tab-btn" data-tab="register">РЕГИСТРАЦИЯ</div>
            </div>
            <div id="tab-login" class="tab-content active">
                <input type="text" id="login-name" placeholder="Имя пилота"><br>
                <input type="password" id="login-pass" placeholder="Пароль"><br>
                <button id="btn-login" style="width:100%;">Войти</button>
            </div>
            <div id="tab-register" class="tab-content">
                <input type="text" id="reg-name" placeholder="Имя (мин 3 символа)"><br>
                <input type="password" id="reg-pass" placeholder="Пароль (мин 4)"><br>
                <input type="password" id="reg-pass2" placeholder="Подтвердить пароль"><br>
                <button id="btn-register" style="width:100%;">Зарегистрироваться</button>
            </div>
            <button id="btn-guest" class="gold" style="width:100%;margin-top:8px;">Играть гостем</button>
            <div id="login-msg" style="color:var(--danger);text-align:center;margin-top:6px;font-size:13px;"></div>
        </div>
    </div>

    <div id="hangar-screen" class="screen">
        <div style="display:flex;width:100%;height:100%;padding:8px;gap:8px;">
            <div class="panel" style="width:200px;overflow-y:auto;max-height:100%;" id="slot-list"></div>
            <div class="panel" style="flex:1;text-align:center;" id="robot-display"></div>
            <div class="panel" style="width:280px;" id="robot-stats"></div>
        </div>
        <div id="owner-code-area">
            <input id="owner-code-input" placeholder="OWNER CODE">
            <button onclick="applyOwnerCode()" style="font-size:11px;">OK</button>
            <button id="toggle-code-pad" style="display:none; font-size:11px; padding:4px 8px; background:#555;">🔑</button>
        </div>
        <div style="position:absolute;top:5px;right:10px;display:flex;gap:8px;align-items:center;">
            <span id="pilot-name-display" style="color:var(--gold);"></span>
            <span>💰<span id="silver-display">0</span></span>
            <span>⭐<span id="gold-display">0</span></span>
            <span>👻<span id="soul-display">0</span></span>
            <button onclick="logout()" class="danger" style="font-size:12px;">Выйти</button>
        </div>
        <div style="position:absolute;bottom:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap;">
            <button onclick="startBattle('TDM')" class="success">⚔️ TDM</button>
            <button onclick="startBattle('CAPTURE')">🎯 ЗАХВАТ</button>
            <button onclick="startBattle('SURVIVAL')">💀 ВЫЖИВАНИЕ</button>
            <button onclick="startBattle('DUEL')">🤜 ДУЭЛЬ 1v1</button>
            <button onclick="startBattle('TEAM')" class="team">👥 КОМАНДНЫЙ</button>
            <button onclick="toggleNightMode()" id="night-mode-btn">🌙 Ночной режим</button>
        </div>
        <div style="position:absolute;bottom:8px;right:8px;display:flex;gap:4px;">
            <button onclick="openBox()">📦 Ящик</button>
            <button onclick="claimGift()" id="gift-btn">🎁 Подарок</button>
            <button onclick="openSoulShop()" style="background:#660000;">💀 Магазин душ</button>
        </div>
    </div>
    <div id="modal-overlay" class="modal-overlay"><div class="modal" id="modal-content"></div></div>
    <div id="gameover-panel"><div class="panel"><h2 id="gameover-text" style="color:var(--danger);">ВСЕ РОБОТЫ УНИЧТОЖЕНЫ</h2><button onclick="returnToHangar()" style="display:block;width:220px;margin:8px auto;">В АНГАР</button><button onclick="restartBattle()" class="success" style="display:block;width:220px;margin:8px auto;">НОВЫЙ БОЙ</button></div></div>
</div>

function showToast(msg) { const tc = document.getElementById('toast-container'); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; tc.appendChild(t); setTimeout(() => t.remove(), 2100); }
function ensurePartsKeys() { for (let r in ROBOTS) { if (!(r in parts)) parts[r]=0; } for (let w in WEAPONS) { if (!(w in parts)) parts[w]=0; } for (let d in DRONES) { if (!(d in parts)) parts[d]=0; } }
function getRobotStat(slot, stat) { if (!slot || !slot.robotName) return 0; const robot = ROBOTS[slot.robotName]; if (!robot) return 0; const mk = slot.mkLevel || 'MK1'; const lvl = slot.level || 1; const mults = { 'MK1': [1.00,1.08,1.16,1.24,1.32,1.40,1.48,1.56,1.64,1.72,1.80,1.88], 'MK2': [2.07,2.18,2.29,2.40,2.51,2.62,2.73,2.84,2.95,3.06,3.17,3.28], 'MK3': [3.77] }; const mult = mults[mk]?.[Math.min(lvl-1, (mults[mk]?.length||1)-1)] || 1; if (stat === 'hp') return robot.hp * mult; if (stat === 'speed') return Math.min(7.0, robot.speed * (1 + (mult - 1) * 0.4)); return mult; }
function getWeaponDamage(weaponObj) { if (!weaponObj || !weaponObj.name) return 0; const base = WEAPONS[weaponObj.name]?.dmg || 0; const mk = weaponObj.mkLevel || 'MK1'; const lvl = weaponObj.level || 1; const mults = { 'MK1': [1.00,1.05,1.10,1.15,1.20,1.25,1.30,1.35,1.40,1.45,1.50,1.55], 'MK2': [1.75,1.80,1.85,1.90,1.95,2.00,2.05,2.10,2.15,2.20,2.25,2.30], 'MK3': [2.50] }; return Math.round(base * (mults[mk]?.[Math.min(lvl-1, (mults[mk]?.length||1)-1)] || 1)); }
function getWeaponUpgradeCost(weaponObj) { if (!weaponObj) return null; const mk = weaponObj.mkLevel || 'MK1'; const lvl = weaponObj.level || 1; if (mk === 'MK3') return null; if (mk === 'MK1' && lvl >= 12) return { type: 'mk2', cost: 1000, currency: 'gold' }; if (mk === 'MK2' && lvl >= 12) return { type: 'mk3', costGold: 2000, costSilver: 5000 }; return { type: 'level', cost: lvl * 50 + 100, currency: 'silver' }; }
function showModal(html) { document.getElementById('modal-content').innerHTML = html; document.getElementById('modal-overlay').classList.add('active'); }
function hideModal() { document.getElementById('modal-overlay').classList.remove('active'); }
function isRobotOwned(name) { return hangarSlots.some(s => s.robotName === name); }
function rectCollide(ax, ay, ar, bx, by, bw, bh) { return ax+ar>bx && ax-ar<bx+bw && ay+ar>by && ay-ar<by+bh; }

function saveAccount() { if (!currentAccount) return; if (!accounts[currentAccount]) accounts[currentAccount] = {}; const a = accounts[currentAccount]; a.silver = silver; a.gold = gold; a.soulCoins = soulCoins; a.parts = JSON.parse(JSON.stringify(parts)); a.hangarSlots = JSON.parse(JSON.stringify(hangarSlots)); a.lastGiftTime = lastGiftTime; a.password = a.password || ''; localStorage.setItem('warRobots_v26', JSON.stringify(accounts)); }
function loadAccount(name) { const s = localStorage.getItem('warRobots_v26'); if (s) { try { accounts = JSON.parse(s); } catch (e) { accounts = {}; } } const d = accounts[name]; if (!d) return false; currentAccount = name; silver = d.silver||500; gold = d.gold||50; soulCoins = d.soulCoins||0; parts = d.parts||{}; hangarSlots = d.hangarSlots||[]; lastGiftTime = d.lastGiftTime||0; while (hangarSlots.length < 5) hangarSlots.push({ robotName: null, weapons: [], drone: null, mkLevel: 'MK1', level: 1, currentHp: null, modules: [null, null], pilot: null }); hangarSlots.forEach(s => { if (!s.weapons) s.weapons = []; s.weapons = s.weapons.map(w => { if (typeof w === 'string') return { name: w, mkLevel: 'MK1', level: 1 }; if (w && w.name) return { name: w.name, mkLevel: w.mkLevel||'MK1', level: w.level||1 }; return null; }); if (!s.mkLevel) s.mkLevel='MK1'; if (!s.level) s.level=1; if (s.currentHp===undefined) s.currentHp=null; if (!s.drone) s.drone=null; if (!s.modules) s.modules = [null, null]; if (!s.pilot) s.pilot = null; }); ensurePartsKeys(); if (!hangarSlots.some(s=>s.robotName)) hangarSlots[0] = { robotName:'Destrier', weapons:[{name:'LightCannon',mkLevel:'MK1',level:1},null], drone:null, mkLevel:'MK1', level:1, currentHp:null, modules:[null,null], pilot:null }; saveAccount(); setTimeout(()=>canvas.focus(), 100); return true; }
function initNewAccount(name) { currentAccount=name; silver=500; gold=50; soulCoins=0; parts={}; ensurePartsKeys(); parts['LightCannon']=3; parts['Taran']=6; parts['Zeus']=15; parts['Ultimate Sting']=25; hangarSlots = [ { robotName:'Destrier', weapons:[{name:'LightCannon',mkLevel:'MK1',level:1},null], drone:null, mkLevel:'MK1', level:1, currentHp:null, modules:[null,null], pilot:null }, { robotName:null, weapons:[], drone:null, mkLevel:'MK1', level:1, currentHp:null, modules:[null,null], pilot:null }, { robotName:null, weapons:[], drone:null, mkLevel:'MK1', level:1, currentHp:null, modules:[null,null], pilot:null }, { robotName:null, weapons:[], drone:null, mkLevel:'MK1', level:1, currentHp:null, modules:[null,null], pilot:null }, { robotName:null, weapons:[], drone:null, mkLevel:'MK1', level:1, currentHp:null, modules:[null,null], pilot:null }, ]; lastGiftTime=0; if (!accounts[name]) accounts[name]={password:''}; saveAccount(); showHangar(); setTimeout(()=>canvas.focus(),100); }

function showScreen(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); document.getElementById('combat-ui').classList.remove('active'); document.getElementById('gameover-panel').style.display='none'; combatActive=false; if (gameLoopId) { cancelAnimationFrame(gameLoopId); gameLoopId=null; } document.getElementById('mobile-controls').style.display = (isMobile && (id === 'hangar-screen' || combatActive)) ? 'block' : 'none'; }

function showLogin() { showScreen('login-screen'); hideModal(); }

function toggleNightMode() { nightMode = !nightMode; document.getElementById('night-mode-btn').textContent = nightMode ? '☀️ Дневной режим' : '🌙 Ночной режим'; }

function updateHangarUI() { const sl = document.getElementById('slot-list'); sl.innerHTML = '<h3 style="color:var(--gold);">АНГАР</h3>'; for (let i=0; i<hangarSlots.length; i++) { const s = hangarSlots[i]; const d = document.createElement('div'); d.style.cssText = `padding:6px;margin:2px 0;cursor:pointer;border-radius:5px;border:1px solid ${i===selectedSlot?'var(--accent)':'var(--border)'};background:${i===selectedSlot?'rgba(68,119,255,0.2)':'transparent'};font-size:12px;`; if (s.robotName && ROBOTS[s.robotName]) { d.innerHTML = `<b>${s.robotName}</b><br>${s.mkLevel}.${s.level}`; d.style.borderLeft = `3px solid ${ROBOTS[s.robotName].color}`; } else d.innerHTML = '<span style="color:#888;">СВОБОДНО</span>'; d.addEventListener('click', ()=>{ selectedSlot=i; updateHangarUI(); }); sl.appendChild(d); } updateRobotDisplay(); updateRobotStats(); document.getElementById('silver-display').textContent = silver; document.getElementById('gold-display').textContent = gold; document.getElementById('soul-display').textContent = soulCoins; document.getElementById('pilot-name-display').textContent = currentAccount || 'Гость'; }
function updateRobotDisplay() { const d = document.getElementById('robot-display'); const s = hangarSlots[selectedSlot]; d.innerHTML = ''; if (!s.robotName || !ROBOTS[s.robotName]) { d.innerHTML = `<div style="padding:50px;"><button onclick="openRobotSelectionModal()" class="success">Собрать робота</button></div>`; return; } const r = ROBOTS[s.robotName]; let wh = ''; r.slots.forEach((t,i)=>{ const w = s.weapons[i]; const wn = w?w.name:'пусто'; wh += `<div style="display:inline-block;margin:3px;padding:5px;border:1px dashed #555;border-radius:6px;width:44px;height:44px;line-height:44px;font-size:8px;cursor:pointer;background:rgba(0,0,0,0.3);" onclick="openWeaponSelectionModal(${i})">${wn.substring(0,5)}</div>`; }); d.innerHTML = `<h3 style="color:${r.color};">${s.robotName}</h3><div style="width:90px;height:90px;background:${r.color};border-radius:50%;margin:10px auto;"></div><p style="font-size:11px;">${r.ability||'Нет'}</p><div>${wh}</div><button onclick="openDroneSelectionModal()">🛸 ${s.drone||'Дрон'}</button>`; }
function updateRobotStats() { const st = document.getElementById('robot-stats'); const s = hangarSlots[selectedSlot]; if (!s.robotName || !ROBOTS[s.robotName]) { st.innerHTML = ''; return; } const r = ROBOTS[s.robotName]; let wepInfo = ''; s.weapons.forEach((w,i)=>{ if (w && w.name) { const dmg = getWeaponDamage(w); wepInfo += `<p>🔫 ${w.name} (${dmg} dmg) ${w.mkLevel}.${w.level} <button onclick="upgradeWeapon(${i})" style="font-size:10px;padding:2px 5px;">↑</button></p>`; } else wepInfo += `<p>⚪ слот ${i+1}: пусто</p>`; }); let modInfo = '<p>🔧 Модули:</p>'; s.modules.forEach((m,i)=>{ if (m) modInfo += `<p>Слот ${i+1}: ${m.name} (ур.${m.level}) <button onclick="upgradeModule(${i})" style="font-size:10px;padding:2px 5px;">↑</button> <button onclick="unequipModule(${i})" style="font-size:10px;padding:2px 5px;">✕</button></p>`; else modInfo += `<p>Слот ${i+1}: <button onclick="openModuleSelectionModal(${i})" style="font-size:10px;padding:2px 5px;">Установить</button></p>`; }); let pilotInfo = `<p>👨‍✈️ Пилот: ${s.pilot ? s.pilot.name + ' (' + s.pilot.uniqueSkill + ')' : 'Нет'}</p>`; if (s.pilot) { pilotInfo += `<p>🎯 Навыки: ${s.pilot.skills.join(', ')}</p>`; pilotInfo += `<button onclick="rerollPilotSkills()" style="font-size:10px;padding:2px 5px;">🎲 Перебросить навыки (50💰)</button> <button onclick="removePilot()" style="font-size:10px;padding:2px 5px;">✕ Уволить</button>`; } else { pilotInfo += `<button onclick="assignPilot()" style="font-size:10px;padding:2px 5px;">Назначить пилота</button>`; } st.innerHTML = `<h4 style="color:${r.color};">${s.robotName}</h4><p>❤️ HP: ${Math.round(getRobotStat(s,'hp'))}</p><p>🏃 Скорость: ${getRobotStat(s,'speed').toFixed(1)}</p><p>⭐ ${s.mkLevel}.${s.level}</p><p>🎯 ${r.ability||'Нет'}</p>${wepInfo}${modInfo}${pilotInfo}<p>🛸 ${s.drone||'Нет'}</p><button onclick="upgradeRobot()" class="gold">Улучшить робота</button><button onclick="openRobotSelectionModal()">Сменить</button>`; }
function upgradeWeapon(idx) { const s = hangarSlots[selectedSlot]; if (!s || !s.weapons[idx] || !s.weapons[idx].name) return; const w = s.weapons[idx]; const cost = getWeaponUpgradeCost(w); if (!cost) return; if (cost.type === 'level') { if (silver < cost.cost) return; silver -= cost.cost; w.level++; } else if (cost.type === 'mk2') { if (gold < cost.cost) return; gold -= cost.cost; w.mkLevel = 'MK2'; w.level = 1; } else if (cost.type === 'mk3') { if (gold < cost.costGold || silver < cost.costSilver) return; gold -= cost.costGold; silver -= cost.costSilver; w.mkLevel = 'MK3'; w.level = 1; } saveAccount(); updateHangarUI(); }
function openModuleSelectionModal(slotIndex) { let h = '<h3>Выбор модуля</h3><button class="close-btn" onclick="hideModal()">✕</button>'; for (let [n,d] of Object.entries(MODULES)) { const cost = d.baseCost; const currency = d.currency || 'silver'; const canBuy = currency === 'gold' ? gold >= cost : silver >= cost; h += `<div class="item-row ${canBuy?'':'locked'}" onclick="${canBuy?'equipModule('+slotIndex+',\''+n+'\')':''}" style="${canBuy?'':'opacity:0.5'}"><span>${n}: ${d.desc}</span><span>${cost}${currency==='gold'?'⭐':'💰'}</span></div>`; } showModal(h); }
function equipModule(slotIndex, moduleName) { const mod = MODULES[moduleName]; if (!mod) return; const cost = mod.baseCost; const currency = mod.currency || 'silver'; if (currency === 'gold' && gold < cost) return; if (currency === 'silver' && silver < cost) return; if (currency === 'gold') gold -= cost; else silver -= cost; hangarSlots[selectedSlot].modules[slotIndex] = { name: moduleName, level: 1 }; saveAccount(); hideModal(); updateHangarUI(); }
function upgradeModule(slotIndex) { const mod = hangarSlots[selectedSlot].modules[slotIndex]; if (!mod) return; const def = MODULES[mod.name]; if (!def || mod.level >= def.maxLevel) return; const cost = def.baseCost + (mod.level - 1) * 100; if (silver < cost) return; silver -= cost; mod.level++; saveAccount(); updateHangarUI(); }
function unequipModule(slotIndex) { hangarSlots[selectedSlot].modules[slotIndex] = null; saveAccount(); updateHangarUI(); }
function assignPilot() { const s = hangarSlots[selectedSlot]; if (!s.robotName || !PILOTS[s.robotName]) return; const pdef = PILOTS[s.robotName]; const skills = []; const pool = [...RANDOM_SKILLS]; for (let i = 0; i < 2; i++) { const idx = Math.floor(Math.random() * pool.length); skills.push(pool.splice(idx, 1)[0]); } s.pilot = { name: pdef.name, uniqueSkill: pdef.uniqueSkill, skills }; saveAccount(); updateHangarUI(); }
function rerollPilotSkills() { const s = hangarSlots[selectedSlot]; if (!s.pilot) return; if (silver < 50) return; silver -= 50; const pool = [...RANDOM_SKILLS]; const skills = []; for (let i = 0; i < 2; i++) { const idx = Math.floor(Math.random() * pool.length); skills.push(pool.splice(idx, 1)[0]); } s.pilot.skills = skills; saveAccount(); updateHangarUI(); }
function removePilot() { hangarSlots[selectedSlot].pilot = null; saveAccount(); updateHangarUI(); }
function openRobotSelectionModal() { let h = '<h3>Сборка</h3><button class="close-btn" onclick="hideModal()">✕</button><div style="max-height:340px;overflow-y:auto;">'; for (let [n,d] of Object.entries(ROBOTS)) { const ow=isRobotOwned(n), hv=parts[n]||0, can=hv>= (n==='Reaper'?1:d.parts)&&!ow; h += `<div class="item-row ${ow?'owned':(!can?'locked':'')}" onclick="${can||(n==='Destrier'&&!ow)?'buildRobot(\''+n+'\')':''}" style="${!can&&!ow?'opacity:0.5':''}"><span>${n}</span><span>${ow?'✅':hv+'/'+(n==='Reaper'?1:d.parts)}</span></div>`; } h += '</div>'; showModal(h); }
function buildRobot(name) { const d=ROBOTS[name]; if(!d) return; if (isRobotOwned(name)) return; const needed = name==='Reaper'?1:d.parts; if (name!=='Destrier' && (parts[name]||0) < needed) { alert('Недостаточно деталей!'); return; } if (name!=='Destrier') parts[name]-=needed; const curWeps = hangarSlots[selectedSlot].weapons ? [...hangarSlots[selectedSlot].weapons] : []; hangarSlots[selectedSlot] = { robotName:name, weapons:new Array(d.slots.length).fill(null), drone:null, mkLevel:'MK1', level:1, currentHp:null, modules:[null,null], pilot:null }; for (let i=0; i<Math.min(curWeps.length, d.slots.length); i++) { if (curWeps[i] && curWeps[i].name && WEAPONS[curWeps[i].name] && WEAPONS[curWeps[i].name].type === d.slots[i]) hangarSlots[selectedSlot].weapons[i] = curWeps[i]; } saveAccount(); hideModal(); updateHangarUI(); }
function openWeaponSelectionModal(idx) { const s = hangarSlots[selectedSlot]; if (!s.robotName) return; const tp = ROBOTS[s.robotName].slots[idx]; let h = `<h3>Оружие #${idx+1} (${tp})</h3><button class="close-btn" onclick="hideModal()">✕</button><div onclick="unequipWeapon(${idx})" style="color:var(--danger);cursor:pointer;">🗑️ Снять</div>`; for (let [n,d] of Object.entries(WEAPONS)) { if (d.type !== tp) continue; const hv = parts[n]||0, can = hv>=1; h += `<div class="item-row ${can?'':'locked'}" onclick="${can?'equipWeapon('+idx+',\''+n+'\')':''}" style="${can?'':'opacity:0.5'}"><span>${n} (${d.dmg})</span><span>${hv}/1</span></div>`; } showModal(h); }
function equipWeapon(idx, name) { if ((parts[name]||0)<1) return; parts[name]-=1; hangarSlots[selectedSlot].weapons[idx]={name,mkLevel:'MK1',level:1}; saveAccount(); hideModal(); updateHangarUI(); }
function unequipWeapon(idx) { hangarSlots[selectedSlot].weapons[idx]=null; saveAccount(); hideModal(); updateHangarUI(); }
function openDroneSelectionModal() { if (!hangarSlots[selectedSlot].robotName) return; let h = '<h3>Дрон</h3><button class="close-btn" onclick="hideModal()">✕</button><div onclick="unequipDrone()" style="color:var(--danger);cursor:pointer;">🗑️ Снять</div>'; for (let [n,d] of Object.entries(DRONES)) { const hv = parts[n]||0, can = hv>=d.parts; h += `<div class="item-row ${can?'':'locked'}" onclick="${can?'equipDrone(\''+n+'\')':''}" style="${can?'':'opacity:0.5'}"><span>${n}: ${d.desc}</span><span>${hv}/${d.parts}</span></div>`; } showModal(h); }
function equipDrone(name) { if ((parts[name]||0)<DRONES[name].parts) return; parts[name]-=DRONES[name].parts; hangarSlots[selectedSlot].drone=name; saveAccount(); hideModal(); updateHangarUI(); }
function unequipDrone() { hangarSlots[selectedSlot].drone=null; saveAccount(); hideModal(); updateHangarUI(); }
function upgradeRobot() { const s = hangarSlots[selectedSlot]; if (!s.robotName) return; if (s.mkLevel === 'MK3') return; if (s.mkLevel === 'MK1' && s.level >= 12) { if (gold < 1000) return; gold -= 1000; s.mkLevel = 'MK2'; s.level = 1; } else if (s.mkLevel === 'MK2' && s.level >= 12) { if (gold < 2000 || silver < 5000) return; gold -= 2000; silver -= 5000; s.mkLevel = 'MK3'; s.level = 1; } else { const c = s.level * 50 + 100; if (silver < c) return; silver -= c; s.level++; } saveAccount(); updateHangarUI(); }
function openBox() { if (silver < 100) { showToast('❌ Недостаточно серебра!'); return; } silver -= 100; const sg = Math.floor(Math.random()*51)+30; silver += sg; let msg = `📦 +${sg}💰`; if (Math.random() < 0.3) { const gg = Math.floor(Math.random()*8)+3; gold += gg; msg += `, +${gg}⭐`; } if (Math.random() < 0.2) { const items = [...Object.keys(ROBOTS),...Object.keys(WEAPONS),...Object.keys(DRONES)]; const it = items[Math.floor(Math.random()*items.length)]; const cnt = Math.floor(Math.random()*3)+1; parts[it] = (parts[it]||0)+cnt; msg += `, +${cnt} дет. ${it}`; } showToast(msg); saveAccount(); updateHangarUI(); }
function claimGift() { const now = Date.now(); if (now - lastGiftTime < 600000) { showToast('⏳ Подождите ещё ' + Math.ceil((600000 - (now - lastGiftTime)) / 60000) + ' мин.'); return; } lastGiftTime = now; silver += 80; gold += 5; let msg = '🎁 +80💰, +5⭐'; if (Math.random() < 0.3) { const r = Object.keys(ROBOTS)[Math.floor(Math.random()*Object.keys(ROBOTS).length)]; parts[r] = (parts[r]||0)+1; msg += ', +1 деталь'; } showToast(msg); saveAccount(); updateHangarUI(); updateGiftButton(); }
function updateGiftButton() { const btn = document.getElementById('gift-btn'); if (!btn) return; const rem = Math.max(0, 600000 - (Date.now() - lastGiftTime)); btn.textContent = rem > 0 ? `🎁 ${Math.ceil(rem/60000)}мин` : '🎁 Подарок'; setTimeout(updateGiftButton, 10000); }
function applyOwnerCode() { const code = document.getElementById('owner-code-input').value.trim(); if (code !== 'OWNER2025') { showToast('Неверный код'); return; } soulCoins = 999999; silver = 999999; gold = 999999; for (let r in ROBOTS) parts[r] = 999; for (let w in WEAPONS) parts[w] = 999; for (let d in DRONES) parts[d] = 999; const allRobotNames = [...Object.keys(ROBOTS)]; hangarSlots = []; for (let i = 0; i < 20; i++) { if (i < allRobotNames.length) { const rName = allRobotNames[i]; const r = ROBOTS[rName]; const weapons = r.slots.map(slotType => { const fitting = Object.entries(WEAPONS).filter(([n,d]) => d.type === slotType); return fitting.length > 0 ? { name: fitting[0][0], mkLevel: 'MK3', level: 1 } : null; }); hangarSlots.push({ robotName: rName, weapons, drone: 'Octanian', mkLevel: 'MK3', level: 1, currentHp: null, modules: [null, null], pilot: null }); } else { hangarSlots.push({ robotName: null, weapons: [], drone: null, mkLevel: 'MK1', level: 1, currentHp: null, modules: [null, null], pilot: null }); } } selectedSlot = 0; saveAccount(); updateHangarUI(); showToast('OWNERCODE активирован! 20 слотов, все роботы, 999999👻'); document.getElementById('owner-code-input').value = ''; }

function updateEntity(entity) { if (!entity || entity.hp<=0) return; if (entity.stunned > 0) { entity.stunned--; return; } if (entity.abilityCooldown>0) entity.abilityCooldown--; if (entity.abilityTimer>0) { entity.abilityTimer--; if (entity.abilityTimer===0) { entity.damageBoost=1; entity.selfHeal=0; } } if (entity.dashRechargeTimer>0) entity.dashRechargeTimer--; else if (entity.dashCharges< (entity.pilot?.name==='Dash Expert'?4:3) && entity.ability==='Dash') { entity.dashCharges++; entity.dashRechargeTimer=120; } if (entity.invisTimer>0) entity.invisTimer--; if (entity.invulnerable>0) entity.invulnerable--; if (entity.selfHeal>0) entity.hp = Math.min(entity.maxHp, entity.hp + entity.selfHeal/60); if (entity.slow) { entity.slow.timer--; if (entity.slow.timer<=0) entity.slow=null; } if (entity.poison) { entity.hp-=entity.poison.dps/60; entity.poison.timer--; if (entity.poison.timer<=0) entity.poison=null; } if (entity.fire) { entity.hp-=entity.fire.dps/60; entity.fire.timer--; if (entity.fire.timer<=0) entity.fire=null; } if (entity.darknessTimer > 0) { entity.darknessTimer--; if (entity.darknessTimer <= 0) entity.darkness = false; } if (entity.darknessDot && entity.darknessDotTimer > 0) { entity.hp -= 5/60; entity.darknessDotTimer--; if (entity.darknessDotTimer <= 0) entity.darknessDot = false; } if (entity.deathMarkTimer > 0) { entity.deathMarkTimer--; if (entity.deathMarkTimer <= 0) entity.deathMarked = false; } if (entity.electricAura>0) { const targets = entity.team==='ally'||entity.team==='player'?enemies:allies.concat([player]); targets.forEach(e=>{ if(e&&Math.hypot(e.x-entity.x, e.y-entity.y)<200) e.hp-=30/60; }); entity.electricAura--; } if (entity.firestorm && entity.firestorm.timer>0) { const targets = entity.team==='ally'||entity.team==='player'?enemies:allies.concat([player]); targets.forEach(e=>{ if(e&&Math.hypot(e.x-entity.firestorm.x, e.y-entity.firestorm.y)<entity.firestorm.radius) e.hp-=entity.firestorm.dps/60; }); entity.firestorm.timer--; if(entity.firestorm.timer<=0) entity.firestorm=null; } if (entity.healAura>0) { entity.hp = Math.min(entity.maxHp, entity.hp+25/60); entity.healAura--; } entity.weaponState.forEach((ws,i)=>{ if(ws){ if(ws.cooldown>0)ws.cooldown-=1/60; if(ws.reloading>0){ ws.reloading-=1/60; if(ws.reloading<=0) { const wd = entity.weaponData[i]; ws.ammo = wd ? wd.mag : 20; } } } }); }

function updateCombat() { if (!combatActive||!player) return; updateEntity(player); survivalTimer += 1/60; if (survivalTimer >= 60 && !achSurvival) { showToast('🏆 Выживший! +15💰 +5👻'); silver+=15; soulCoins+=5; achSurvival=true; } let dx=0,dy=0; if (player.stunned<=0) { if (isMobile && joystickActive) { const jdx = joystickPos.x - joystickCenter.x; const jdy = joystickPos.y - joystickCenter.y; const maxDist = 50; const dist = Math.min(Math.hypot(jdx, jdy), maxDist); if (dist > 8) { const normX = jdx / Math.hypot(jdx, jdy); const normY = jdy / Math.hypot(jdx, jdy); keys['w'] = normY < -0.3; keys['s'] = normY > 0.3; keys['a'] = normX < -0.3; keys['d'] = normX > 0.3; keys['arrowup'] = keys['w']; keys['arrowdown'] = keys['s']; keys['arrowleft'] = keys['a']; keys['arrowright'] = keys['d']; if (keys['w'] && keys['s']) { keys['w'] = false; keys['s'] = false; } if (keys['a'] && keys['d']) { keys['a'] = false; keys['d'] = false; } } else { keys['w'] = false; keys['s'] = false; keys['a'] = false; keys['d'] = false; keys['arrowup'] = false; keys['arrowdown'] = false; keys['arrowleft'] = false; keys['arrowright'] = false; } } if (isMobile && enemies.length > 0) { let nearest=null, nd=Infinity; enemies.forEach(e=>{ if(e&&e.hp>0){ const d=Math.hypot(e.x-player.x, e.y-player.y); if(d<nd){nd=d;nearest=e;} } }); if(nearest){ mouseX=nearest.x; mouseY=nearest.y; mouseDown=nd<Math.min(400, player.weaponData[0]?.range||350); } else { mouseDown=false; } } if (keys['w']||keys['arrowup']) dy-=1; if (keys['s']||keys['arrowdown']) dy+=1; if (keys['a']||keys['arrowleft']) dx-=1; if (keys['d']||keys['arrowright']) dx+=1; if (dx||dy) { const len=Math.hypot(dx,dy); player.x+=(dx/len)*player.speed; player.y+=(dy/len)*player.speed; player.x=Math.max(15,Math.min(985,player.x)); player.y=Math.max(15,Math.min(625,player.y)); } for (let o of OBSTACLES) { if (rectCollide(player.x,player.y,player.radius,o.x,o.y,o.w,o.h)) { const cx=o.x+o.w/2,cy=o.y+o.h/2,ax=player.x-cx,ay=player.y-cy,ad=Math.hypot(ax,ay)||1; player.x+=(ax/ad)*2; player.y+=(ay/ad)*2; } } shootBattle(); } if (!lastStandUsed && player.modules && player.modules.some(m => m && m.name === 'Last Stand') && player.hp/player.maxHp < 0.2) { lastStandUsed = true; player.invulnerable = 90; showToast('🛡️ Last Stand: неуязвимость 1.5 сек!'); } if (!barrelUsed && player.drone==='Barrel' && player.hp/player.maxHp<0.3) { barrelUsed=true; enemies.forEach(e=>{ if(Math.hypot(e.x-player.x, e.y-player.y)<180) e.hp-=100; }); showToast('💣 Barrel: взрывной урон врагам!'); } allies.forEach(a => { updateEntity(a); entityAI(a); }); enemies.forEach(e => { updateEntity(e); entityAI(e); }); bullets.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; b.traveled+=Math.hypot(b.vx,b.vy); if (b.effect==='homing_poison' && !b.homingActive && b.traveled>30) { const targets = b.isEnemy ? allies.concat([player]) : enemies; let nearest=null, nd=200; targets.forEach(e=>{ if(e&&e.hp>0){ const d=Math.hypot(e.x-b.x, e.y-b.y); if(d<nd){ nd=d; nearest=e; } } }); if(nearest){ b.homingTarget=nearest; b.homingActive=true; } } if (b.homingActive && b.homingTarget && b.homingTarget.hp>0) { const tx=b.homingTarget.x, ty=b.homingTarget.y, tdx=tx-b.x, tdy=ty-b.y, tdist=Math.hypot(tdx,tdy); const speed=Math.hypot(b.vx,b.vy); if (tdist>1) { const angTarget=Math.atan2(tdy,tdx), angCur=Math.atan2(b.vy,b.vx); let diff=angTarget-angCur; while(diff>Math.PI)diff-=2*Math.PI; while(diff<-Math.PI)diff+=2*Math.PI; b.vx=Math.cos(angCur+Math.sign(diff)*Math.min(Math.abs(diff),0.06))*speed; b.vy=Math.sin(angCur+Math.sign(diff)*Math.min(Math.abs(diff),0.06))*speed; } } if (b.x<0||b.x>1000||b.y<0||b.y>640) b.hit=true; for (let o of OBSTACLES) { if (b.x>o.x&&b.x<o.x+o.w&&b.y>o.y&&b.y<o.y+o.h) b.hit=true; } }); bullets.forEach(b=>{ if (b.hit) return; const allTargets = b.isEnemy ? [player, ...allies] : enemies; allTargets.forEach(e=>{ if (!e || e.hp<=0) return; if (Math.hypot(b.x-e.x, b.y-e.y) < e.radius+b.radius+3) { const dmgMult = e.deathMarked ? (e.deathMarkMultiplier || 1.8) : 1; l function drawBattle() { ctx.clearRect(0,0,1000,640); if (nightMode) { ctx.fillStyle='#000005'; ctx.fillRect(0,0,1000,640); ctx.strokeStyle='#0a0a1e'; } else { ctx.fillStyle='#0a0a14'; ctx.fillRect(0,0,1000,640); ctx.strokeStyle='#1a1a2e'; } for (let x=0;x<1000;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,640);ctx.stroke();} for (let y=0;y<640;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1000,y);ctx.stroke();} OBSTACLES.forEach(o=>{ctx.fillStyle=nightMode?'#223':'#334';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle=nightMode?'#445':'#556';ctx.strokeRect(o.x,o.y,o.w,o.h);}); if (!combatActive) return; capturePoints.forEach(cp=>{ctx.fillStyle=cp.owner==='player'?'rgba(68,136,255,0.5)':'rgba(255,68,68,0.5)';ctx.beginPath();ctx.arc(cp.x,cp.y,28,0,Math.PI*2);ctx.fill();}); if (nightMode) { ctx.shadowBlur = 6; } allies.forEach(a=>{ if (a.robotName === 'Turret') { ctx.fillStyle='#aa66ff'; ctx.fillRect(a.x-14, a.y-14, 28, 28); ctx.strokeStyle='#cc88ff'; ctx.lineWidth=2; ctx.strokeRect(a.x-14, a.y-14, 28, 28); ctx.fillStyle='#88ff00'; ctx.beginPath(); ctx.arc(a.x-6, a.y-6, 3, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(a.x+6, a.y+6, 3, 0, Math.PI*2); ctx.fill(); const hpW=30; ctx.fillStyle='#000'; ctx.fillRect(a.x-hpW/2-1, a.y-20, hpW+2, 7); ctx.fillStyle='#44cc66'; ctx.fillRect(a.x-hpW/2, a.y-19, hpW*Math.max(0, a.hp/a.maxHp), 5); ctx.fillStyle='#fff'; ctx.font='bold 7px sans-serif'; ctx.textAlign='center'; ctx.fillText('TURRET', a.x, a.y-24); } else { if (nightMode) ctx.shadowColor = '#4488ff'; ctx.fillStyle='#4488ff';ctx.beginPath();ctx.arc(a.x,a.y,a.radius,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.stroke(); const hpW=a.radius*2; ctx.fillStyle='#000';ctx.fillRect(a.x-hpW/2-1, a.y-a.radius-13, hpW+2, 9); ctx.fillStyle='#44cc66';ctx.fillRect(a.x-hpW/2, a.y-a.radius-12, hpW*Math.max(0,a.hp/a.maxHp), 7); ctx.fillStyle='#fff';ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.fillText(a.robotName,a.x,a.y-a.radius-16); } }); enemies.forEach(e=>{ if (nightMode) ctx.shadowColor = e.color; ctx.fillStyle=e.stunned>0?'#ffff00':e.color; ctx.beginPath();ctx.arc(e.x,e.y,e.radius,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.stroke(); const hpW=e.radius*2; ctx.fillStyle='#000';ctx.fillRect(e.x-hpW/2-1, e.y-e.radius-13, hpW+2, 9); ctx.fillStyle=(e.hp/e.maxHp)<0.3?'#ff3344':'#ff6644';ctx.fillRect(e.x-hpW/2, e.y-e.radius-12, hpW*Math.max(0,e.hp/e.maxHp), 7); }); if (player) { ctx.fillStyle=player.invulnerable>0?'#fff':(ROBOTS[player.robotName]?.color||'#888'); ctx.beginPath();ctx.arc(player.x,player.y,player.radius,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke(); if (player.weaponData.length>0) { const total=player.weaponData.length; for(let i=0;i<total;i++){ const wd=player.weaponData[i]; const fp=getWeaponFirePoint(i,total,player); const wpX=player.x+Math.cos(fp.angle)*(player.radius-3); const wpY=player.y+Math.sin(fp.angle)*(player.radius-3); ctx.fillStyle=wd.color||'#fff';ctx.beginPath();ctx.arc(wpX,wpY,wd.type==='heavy'?4:wd.type==='medium'?3:2,0,Math.PI*2);ctx.fill(); } } if (player.drone) { const droneAngle=Date.now()/500; const dx=player.x+Math.cos(droneAngle)*28; const dy=player.y+Math.sin(droneAngle)*28; ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(dx,dy,5,0,Math.PI*2);ctx.fill(); } const a=Math.atan2(mouseY-player.y,mouseX-player.x);ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(player.x+Math.cos(a)*player.radius,player.y+Math.sin(a)*player.radius);ctx.lineTo(player.x+Math.cos(a-0.5)*(player.radius+9),player.y+Math.sin(a-0.5)*(player.radius+9));ctx.lineTo(player.x+Math.cos(a+0.5)*(player.radius+9),player.y+Math.sin(a+0.5)*(player.radius+9));ctx.fill(); const hpW=50;ctx.fillStyle='#333';ctx.fillRect(player.x-hpW/2,player.y-player.radius-16,hpW,6); ctx.fillStyle=(player.hp/player.maxHp)<0.3?'#ff3344':'#44cc66';ctx.fillRect(player.x-hpW/2,player.y-player.radius-16,hpW*Math.max(0,player.hp/player.maxHp),6); ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText(player.robotName,player.x,player.y-player.radius-22); } ctx.shadowBlur = 0; if (isMobile && combatActive) { ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(joystickCenter.x, joystickCenter.y, 55, 0, Math.PI*2); ctx.fill(); ctx.stroke(); if (joystickActive) { const jdx=joystickPos.x-joystickCenter.x; const jdy=joystickPos.y-joystickCenter.y; const maxDist=45; const dist=Math.min(Math.hypot(jdx,jdy), maxDist); const ang=Math.atan2(jdy,jdx); const stickX=joystickCenter.x+Math.cos(ang)*dist; const stickY=joystickCenter.y+Math.sin(ang)*dist; ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(stickX, stickY, 22, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.stroke(); } else { ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.arc(joystickCenter.x, joystickCenter.y, 20, 0, Math.PI*2); ctx.fill(); } } bullets.forEach(b=>{ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);ctx.fill();}); particles.forEach(p=>{const a=Math.max(0,p.life/25);if(p.type==='explosion'){const r=(25-p.life)*2; ctx.fillStyle=`rgba(255,150,0,${a})`;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();}}); }

function gameLoop() { if (combatActive) { updateCombat(); drawBattle(); gameLoopId = requestAnimationFrame(gameLoop); } }
requestAnimationFrame(function loop() { if (!combatActive) { ctx.clearRect(0,0,1000,640); ctx.fillStyle='#0a0a14'; ctx.fillRect(0,0,1000,640); } else drawBattle(); requestAnimationFrame(loop); });

function pressCodeDigit(digit) { document.getElementById('owner-code-input').value += digit; }
function pressCodeInput() { document.getElementById('owner-code-input').focus(); }

function setupEventListeners() {
    document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));document.getElementById('tab-'+b.dataset.tab).classList.add('active');}));
    document.getElementById('btn-login').addEventListener('click',()=>{const n=document.getElementById('login-name').value.trim(),p=document.getElementById('login-pass').value,m=document.getElementById('login-msg');if(!n||!p)m.textContent='Заполните поля';else if(!accounts[n])m.textContent='Не найден';else if(accounts[n].password!==p)m.textContent='Неверный пароль';else if(loadAccount(n))showHangar();});
    document.getElementById('btn-register').addEventListener('click',()=>{const n=document.getElementById('reg-name').value.trim(),p=document.getElementById('reg-pass').value,p2=document.getElementById('reg-pass2').value,m=document.getElementById('login-msg');if(n.length<3)m.textContent='Имя: 3+ симв.';else if(p.length<4)m.textContent='Пароль: 4+ симв.';else if(p!==p2)m.textContent='Пароли не совпадают';else if(accounts[n])m.textContent='Занято';else{accounts[n]={password:p};localStorage.setItem('warRobots_v26',JSON.stringify(accounts));initNewAccount(n);accounts[n].password=p;saveAccount();showHangar();}});
    document.getElementById('btn-guest').addEventListener('click',()=>{const gn='Guest_'+Math.floor(Math.random()*9000+1000);accounts[gn]={password:''};localStorage.setItem('warRobots_v26',JSON.stringify(accounts));initNewAccount(gn);showHangar();});
    document.getElementById('modal-overlay').addEventListener('click',function(e){if(e.target===this)hideModal();});
}

document.addEventListener('DOMContentLoaded', () => {
    isMobile = /Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent) || ('ontouchstart' in window && window.innerWidth < 1024);
    const s = localStorage.getItem('warRobots_v26'); if (s) try { accounts = JSON.parse(s); } catch (e) { accounts = {}; }
    setupEventListeners();
    if (isMobile) { canvas.style.width='100%'; canvas.style.height='auto'; canvas.style.maxHeight='100vh'; document.getElementById('app').style.width='100%'; document.getElementById('app').style.height='100vh'; document.getElementById('app').style.maxWidth='1000px'; document.getElementById('app').style.borderRadius='0'; document.addEventListener('gesturestart', (e)=>{e.preventDefault();}); document.addEventListener('gesturechange', (e)=>{e.preventDefault();}); document.addEventListener('gestureend', (e)=>{e.preventDefault();}); document.getElementById('toggle-code-pad').style.display='inline-block'; document.getElementById('toggle-code-pad').addEventListener('click',(e)=>{e.stopPropagation(); const pad=document.getElementById('mobile-code-pad'); pad.style.display=pad.style.display==='none'?'block':'none';}); document.addEventListener('click',(e)=>{ const pad=document.getElementById('mobile-code-pad'); if(pad.style.display==='block' && !e.target.closest('#mobile-code-pad') && !e.target.closest('#toggle-code-pad')){pad.style.display='none';} });
        const joystickZone=document.getElementById('joystick-zone');
        function getCanvasCoords(cx,cy){ const r=canvas.getBoundingClientRect(); return {x:cx-r.left, y:cy-r.top}; }
        joystickZone.addEventListener('touchstart',(e)=>{e.preventDefault(); if(joystickId!==null)return; const t=e.changedTouches[0]; joystickId=t.identifier; joystickActive=true; const rect=joystickZone.getBoundingClientRect(); joystickCenter=getCanvasCoords(rect.left+rect.width/2, rect.top+rect.height/2); joystickPos=getCanvasCoords(t.clientX, t.clientY);});
        joystickZone.addEventListener('touchmove',(e)=>{e.preventDefault(); for(let i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===joystickId){joystickPos=getCanvasCoords(e.changedTouches[i].clientX, e.changedTouches[i].clientY);}}});
        joystickZone.addEventListener('touchend',(e)=>{e.preventDefault(); for(let i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===joystickId){joystickActive=false;joystickId=null;joystickPos=getCanvasCoords(joystickCenter.x,joystickCenter.y); keys['w']=false;keys['a']=false;keys['s']=false;keys['d']=false;keys['arrowup']=false;keys['arrowdown']=false;keys['arrowleft']=false;keys['arrowright']=false;}}});
        joystickZone.addEventListener('touchcancel',(e)=>{joystickActive=false;joystickId=null;});
        document.getElementById('mobile-ability').addEventListener('touchstart',(e)=>{e.preventDefault(); if(combatActive&&player&&player.stunned<=0){useEntityAbility(player,mouseX,mouseY);}});
        document.getElementById('mobile-reload').addEventListener('touchstart',(e)=>{e.preventDefault(); if(combatActive&&player)reloadAll();});
        for(let i=1;i<=5;i++){document.getElementById('mob-sw'+i).addEventListener('touchstart',(e)=>{e.preventDefault(); if(combatActive)switchRobotInBattle(i-1);});}
    }
    window.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; keys[e.key.toLowerCase()] = true; canvas.focus(); if (combatActive && player && player.stunned <= 0) { if (e.key.toLowerCase() === 'e') { e.preventDefault(); useEntityAbility(player, mouseX, mouseY); } if (e.key.toLowerCase() === 'r') { e.preventDefault(); reloadAll(); } } if (combatActive && e.key >= '1' && e.key <= '9') { e.preventDefault(); switchRobotInBattle(parseInt(e.key) - 1); } if (e.key === 'Escape') hideModal(); });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
    canvas.addEventListener('mousemove', e => { mouseX = e.clientX - canvas.getBoundingClientRect().left; mouseY = e.clientY - canvas.getBoundingClientRect().top; });
    canvas.addEventListener('mousedown', e => { if (e.button === 0) mouseDown = true; });
    canvas.addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) canvas.focus(); });
    window.addEventListener('focus', () => { if (combatActive || document.getElementById('hangar-screen').classList.contains('active')) canvas.focus(); });
    showLogin(); canvas.focus();
});
window.onload = () => { canvas.focus(); window.focus(); };
</script>
