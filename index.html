<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, touch-action=manipulation">
    <title>War Robots v1.36 — Shadow Rising</title>
    <style>
        :root {
            --bg: #0a0a14; --panel: #111122; --border: #334;
            --gold: #ffd700; --silver: #c0c0c0; --accent: #4477ff;
            --danger: #ff3344; --success: #44cc66; --team: #4488ff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none;
            touch-action: manipulation;
        }
        #app {
            width: 1000px; height: 700px; background: var(--panel);
            border: 2px solid var(--border); border-radius: 12px;
            position: relative; overflow: hidden; color: #ddd;
            touch-action: manipulation;
        }
        canvas { display: block; outline: none; }
        canvas:focus { outline: 2px solid #44cc66; }
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; justify-content: center; align-items: center; z-index: 5;
        }
        .screen.active { display: flex; }
        .panel {
            background: rgba(0,0,0,0.85); border: 1px solid var(--border);
            border-radius: 8px; padding: 15px; margin: 5px;
        }
        button {
            background: var(--accent); color: white; border: none;
            padding: 8px 16px; border-radius: 5px; cursor: pointer;
            font-size: 14px; transition: 0.2s; margin: 3px;
        }
        button:hover { filter: brightness(1.2); }
        button.gold { background: #b8960c; }
        button.danger { background: var(--danger); }
        button.success { background: var(--success); }
        button.team { background: var(--team); }
        input {
            background: #1a1a2e; border: 1px solid var(--border); color: white;
            padding: 8px; border-radius: 4px; margin: 4px 0; width: 220px; font-size: 14px;
        }
        input:focus { outline: none; border-color: var(--accent); }
        .tab { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn {
            padding: 8px 20px; cursor: pointer; background: #222;
            border: 1px solid var(--border); border-radius: 5px 5px 0 0;
        }
        .tab-btn.active { background: var(--accent); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        #hud {
            position: absolute; top: 5px; left: 5px; color: white;
            font-size: 12px; pointer-events: none; z-index: 10;
        }
        #combat-ui {
            position: absolute; bottom: 0; left: 0; right: 0;
            display: none; z-index: 10; pointer-events: none;
            padding: 6px 10px; background: rgba(0,0,0,0.85);
        }
        #combat-ui.active {
            display: flex; justify-content: space-between;
            align-items: flex-end; gap: 8px; flex-wrap: wrap;
        }
        .health-bar {
            width: 180px; height: 10px; background: #333;
            border-radius: 5px; overflow: hidden; margin: 2px 0;
        }
        .health-fill { height: 100%; background: var(--success); transition: width 0.3s; }
        .health-fill.low { background: var(--danger); }
        .weapon-indicator {
            background: rgba(0,0,0,0.7); color: #fff; padding: 5px 10px;
            border-radius: 4px; font-size: 11px; pointer-events: auto; white-space: nowrap;
        }
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; justify-content: center;
            align-items: center; z-index: 50;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #1a1a2e; border: 2px solid var(--accent);
            border-radius: 10px; padding: 20px; max-width: 550px;
            max-height: 480px; overflow-y: auto; color: white;
        }
        .modal h3 { color: var(--gold); margin-bottom: 10px; }
        .modal .item-row {
            padding: 6px; cursor: pointer; border-radius: 4px;
            margin: 2px 0; display: flex; justify-content: space-between;
        }
        .modal .item-row:hover { background: rgba(68,119,255,0.3); }
        .modal .close-btn {
            float: right; background: var(--danger); font-size: 12px; padding: 4px 10px;
        }
        #gameover-panel {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%,-50%); z-index: 20; text-align: center;
        }
        #toast-container {
            position: absolute; top: 40px; right: 10px; z-index: 15; pointer-events: none;
        }
        .toast {
            background: rgba(0,0,0,0.85); color: #ffd700; padding: 5px 12px;
            margin: 4px; border-radius: 4px; font-size: 13px;
            animation: toastAnim 2.0s forwards;
        }
        @keyframes toastAnim {
            0% { opacity: 0; transform: translateX(30px); }
            15% { opacity: 1; transform: translateX(0); }
            70% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(30px); }
        }
        #owner-code-area {
            position: absolute; top: 5px; left: 200px; display: flex; gap: 5px; z-index: 20;
        }
        #owner-code-input { width: 120px; padding: 4px; font-size: 12px; }
        .bottom-btn { padding: 6px 10px !important; font-size: 12px !important; }
        .mode-card {
            background: rgba(0,0,0,0.5); border: 1px solid #555;
            border-radius: 8px; padding: 10px; margin: 5px; width: 45%;
            display: inline-block; vertical-align: top; text-align: center;
        }
        .mode-card h4 { color: var(--gold); font-size: 16px; }
        .mode-card p { font-size: 11px; color: #aaa; }
    </style>
</head>

            <span>👻<span id="soul-display">0</span></span>

        </div>

function showToast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.getElementById('toast-container').appendChild(t); setTimeout(() => t.remove(), 2100); }
function ensurePartsKeys() { for (let r in ROBOTS) { if (!(r in parts)) parts[r] = 0; } for (let w in WEAPONS) { if (!(w in parts)) parts[w] = 0; } for (let d in DRONES) { if (!(d in parts)) parts[d] = 0; } }
function getRobotStat(slot, stat) {
    if (!slot || !slot.robotName) return 0; const robot = ROBOTS[slot.robotName]; if (!robot) return 0;
    const mk = slot.mkLevel || 'MK1'; const lvl = slot.level || 1;
    const mults = { 'MK1': [1.00,1.08,1.16,1.24,1.32,1.40,1.48,1.56,1.64,1.72,1.80,1.88], 'MK2': [2.07,2.18,2.29,2.40,2.51,2.62,2.73,2.84,2.95,3.06,3.17,3.28], 'MK3': [3.77] };
    const mult = mults[mk]?.[Math.min(lvl - 1, (mults[mk]?.length || 1) - 1)] || 1;
    if (stat === 'hp') return robot.hp * mult;
    if (stat === 'speed') return Math.min(7.0, robot.speed * (1 + (mult - 1) * 0.4));
    return mult;
}
function getWeaponDamage(weaponObj) {
    if (!weaponObj || !weaponObj.name) return 0; const base = WEAPONS[weaponObj.name]?.dmg || 0;
    const mk = weaponObj.mkLevel || 'MK1'; const lvl = weaponObj.level || 1;
    const mults = { 'MK1': [1.00,1.05,1.10,1.15,1.20,1.25,1.30,1.35,1.40,1.45,1.50,1.55], 'MK2': [1.75,1.80,1.85,1.90,1.95,2.00,2.05,2.10,2.15,2.20,2.25,2.30], 'MK3': [2.50] };
    return Math.round(base * (mults[mk]?.[Math.min(lvl - 1, (mults[mk]?.length || 1) - 1)] || 1));
}

function rectCollide(ax, ay, ar, bx, by, bw, bh) { return ax + ar > bx && ax - ar < bx + bw && ay + ar > by && ay - ar < by + bh; }

function assignPilot() {
    const s = hangarSlots[selectedSlot]; if (!s.robotName || !PILOTS[s.robotName]) return;
    const pdef = PILOTS[s.robotName]; const skills = []; const pool = [...RANDOM_SKILLS];
    for (let i = 0; i < 2; i++) { const idx = Math.floor(Math.random() * pool.length); skills.push(pool.splice(idx, 1)[0]); }
    s.pilot = { name: pdef.name, uniqueSkill: pdef.uniqueSkill, skills };
    saveAccount(); updateHangarUI(); showToast('👨‍✈️ Нанят пилот ' + pdef.name + '!');
}
function rerollPilotSkills() { const s = hangarSlots[selectedSlot]; if (!s.pilot) return; if (silver < 50) return; silver -= 50; const pool = [...RANDOM_SKILLS]; const skills = []; for (let i=0;i<2;i++) skills.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]); s.pilot.skills = skills; saveAccount(); updateHangarUI(); }
function removePilot() { hangarSlots[selectedSlot].pilot = null; saveAccount(); updateHangarUI(); }

function upgradeWeapon(idx) {
    const s = hangarSlots[selectedSlot]; if (!s || !s.weapons[idx]) return; const w = s.weapons[idx];
    if (!w.name) return; if (!w.mkLevel) w.mkLevel = 'MK1'; if (!w.level) w.level = 1;
    if (w.mkLevel === 'MK3') { showToast('Уже MK3!'); return; }
    if (w.mkLevel === 'MK1' && w.level >= 12) { if (gold < 1000) { showToast('Нужно 1000⭐'); return; } gold -= 1000; w.mkLevel = 'MK2'; w.level = 1; }
    else if (w.mkLevel === 'MK2' && w.level >= 12) { if (gold < 2000 || silver < 5000) { showToast('Нужно 2000⭐ + 5000💰'); return; } gold -= 2000; silver -= 5000; w.mkLevel = 'MK3'; w.level = 1; }
    else { const cost = w.level * 50 + 100; if (silver < cost) { showToast('Нужно ' + cost + '💰'); return; } silver -= cost; w.level++; }
    saveAccount(); updateHangarUI();
}
function maxUpgradeWeapon(idx) {
    const s = hangarSlots[selectedSlot]; if (!s || !s.weapons[idx] || !s.weapons[idx].name) return;
    const w = s.weapons[idx]; if (!w.mkLevel) w.mkLevel = 'MK1'; if (!w.level) w.level = 1;
    let totalSilver = 0, totalGold = 0; const origMk = w.mkLevel, origLvl = w.level;
    w.mkLevel = origMk; w.level = origLvl;
    while (w.mkLevel !== 'MK3') {
        if (w.mkLevel === 'MK1' && w.level < 12) { while (w.level < 12) { w.level++; totalSilver += w.level * 50 + 100; } }
        else if (w.mkLevel === 'MK1' && w.level >= 12) { totalGold += 1000; w.mkLevel = 'MK2'; w.level = 1; }
        else if (w.mkLevel === 'MK2' && w.level < 12) { while (w.level < 12) { w.level++; totalSilver += w.level * 50 + 100; } }
        else if (w.mkLevel === 'MK2' && w.level >= 12) { totalGold += 2000; totalSilver += 5000; w.mkLevel = 'MK3'; w.level = 1; }
    }
    if (silver < totalSilver || gold < totalGold) { showToast(`Нужно ${totalSilver}💰 + ${totalGold}⭐`); return; }
    silver -= totalSilver; gold -= totalGold; w.mkLevel = 'MK3'; w.level = 1;
    saveAccount(); updateHangarUI(); showToast('⚡ Оружие MK3!');
}

function openRobotSelectionModal() { let h = '<h3>Сборка</h3><button class="close-btn" onclick="hideModal()">✕</button>'; for (let [n,d] of Object.entries(ROBOTS)) { if (d.costSouls) continue; const ow=isRobotOwned(n), hv=parts[n]||0; h += `<div class="item-row" onclick="${hv>=d.parts?'buildRobot(\''+n+'\')':''}" style="${hv<d.parts?'opacity:0.5':''}"><span>${n}${d.legendary?' 👑':''}</span><span>${ow?'✅':hv+'/'+d.parts}</span></div>`; } showModal(h); }
function buildRobot(name) { const d=ROBOTS[name]; if(!d) return; if (isRobotOwned(name)) return; const needed = d.parts||0; if (name!=='Destrier' && (parts[name]||0)<needed) { alert('Недостаточно деталей!'); return; } if (name!=='Destrier') parts[name]-=needed; hangarSlots[selectedSlot] = { robotName:name, weapons:new Array(d.slots.length).fill(null), drone:null, mkLevel:'MK1', level:1, currentHp:null, modules:[null,null], pilot:null }; saveAccount(); hideModal(); updateHangarUI(); }

function openDroneSelectionModal() { let h='<h3>Дрон</h3><button class="close-btn" onclick="hideModal()">✕</button>'; for(let [n,d] of Object.entries(DRONES)){const hv=parts[n]||0;h+=`<div class="item-row" onclick="${hv>=d.parts?'equipDrone(\''+n+'\')':''}" style="${hv<d.parts?'opacity:0.5':''}"><span>${n}: ${d.desc}</span><span>${hv}/${d.parts}</span></div>`;} showModal(h); }

function useEntityAbility(entity,targetX,targetY) { if(!entity||entity.abilityCooldown>0||!entity.ability||entity.stunned>0)return; let cd=180; const a=entity.ability;
    if(a==='Blink'){cd=180;const ang=Math.atan2(targetY-entity.y,targetX-entity.x);entity.x+=Math.cos(ang)*180;entity.y+=Math.sin(ang)*180;}
    else if(a==='Dash'){if(entity.dashCharges>0){cd=120;entity.dashCharges--;const ang=Math.atan2(targetY-entity.y,targetX-entity.x);entity.x+=Math.cos(ang)*100;entity.y+=Math.sin(ang)*100;}}
    else if(a==='Shadow Step'){cd=1200;entity.invisTimer=entity.pilot?.name==='Shade Walker'?420:300;entity.damageBoost=entity.pilot?.name==='Shade Walker'?2.5:2.0;entity.shadowStepActive=true;entity.shadowStepTimer=180;entity.shadowStepSpeed=true;setTimeout(()=>{entity.shadowStepSpeed=false;},120);if(entity.team==='player')showToast('🌑 Shadow Step!');}
    else if(a==='Air Strike'){cd=entity._ultimateCondor?720:900;const mkMult=getRobotStat({robotName:entity.robotName,mkLevel:entity.mkLevel,level:entity.level},'hp')/ROBOTS[entity.robotName].hp;let shieldHp=(entity._ultimateCondor?5000:3000)*mkMult;if(entity.pilot?.name==='Storm King')shieldHp*=2;else if(entity.pilot?.name==='Sport Li')shieldHp*=1.5;entity.physicalShields=entity._ultimateCondor?[shieldHp,shieldHp,shieldHp]:[shieldHp,shieldHp];entity.invisTimer=entity._ultimateCondor?180:120;entity.sonicPulseActive=true;entity.sonicPulseTimer=300;}
    else if(a==='EMP Blast'){cd=600;const targs=entity.team==='ally'||entity.team==='player'?enemies:allies.concat([player]);targs.forEach(e=>{if(Math.hypot(e.x-entity.x,e.y-entity.y)<300)e.stunned=Math.max(e.stunned,entity.pilot?.name==='EMP Specialist'?180:120);});}
    else if(a==='Death Mark'){cd=720;enemies.forEach(e=>{if(Math.hypot(e.x-entity.x,e.y-entity.y)<400){e.deathMarked=true;e.deathMarkTimer=entity.pilot?.name==='Soul Harvester'?480:360;}});}
    abilityUseCount++; updateDailyProgress('abilities',1);
    entity.abilityCooldown=cd;
}

function entityShoot(entity, targetX, targetY) { if(!entity||entity.stunned>0)return; entity.weaponState.forEach((ws,i)=>{if(!ws||ws.reloading>0||ws.ammo<=0)return;const wd=entity.weaponData[i];if(!wd)return;if(wd.cooldown===0&&wd.mag===1&&entity._heavyShotCooldown>0)return;ws.cooldown=wd.cooldown;ws.ammo--;if(wd.cooldown===0&&wd.mag===1)entity._heavyShotCooldown=60;const ang=Math.atan2(targetY-entity.y,targetX-entity.x);const b={x:entity.x+Math.cos(ang)*(entity.radius+8),y:entity.y+Math.sin(ang)*(entity.radius+8),vx:Math.cos(ang)*10,vy:Math.sin(ang)*10,damage:wd.dmg*(entity.damageBoost||1),range:wd.range,traveled:0,radius:3.5,hit:false,color:wd.color||'#fff',isEnemy:entity.team==='enemy',shooter:entity};bullets.push(b);}); }

function entityAI(entity) {
    if(!entity||entity.stunned>0)return;
    const targets=entity.team==='ally'||entity.team==='player'?enemies:allies.concat([player]).filter(t=>t&&t.hp>0);
    if(targets.length===0)return;
    let nearest=null,nd=Infinity;targets.forEach(t=>{const d=Math.hypot(t.x-entity.x,t.y-entity.y);if(d<nd){nd=d;nearest=t;}});
    if(!nearest)return;
    const dx=nearest.x-entity.x,dy=nearest.y-entity.y,dist=nd;
    entity.shootTimer-=1/60;
    if(dist<350&&dist>50&&entity.shootTimer<=0){entity.shootTimer=0.5;entityShoot(entity,nearest.x,nearest.y);}
    if(dist<160){entity.x-=(dx/dist)*entity.speed;entity.y-=(dy/dist)*entity.speed;}else if(dist>350){entity.x+=(dx/dist)*entity.speed;entity.y+=(dy/dist)*entity.speed;}
    if(entity.abilityCooldown<=0&&entity.ability&&Math.random()<0.002)useEntityAbility(entity,nearest.x,nearest.y);
    entity.x=Math.max(15,Math.min(985,entity.x));entity.y=Math.max(15,Math.min(625,entity.y));
}

function updateEntity(entity) {
    if(!entity||entity.hp<=0)return;
    if(entity.stunned>0){entity.stunned--;return;}
    if(entity._heavyShotCooldown>0)entity._heavyShotCooldown--;
    if(entity.abilityCooldown>0)entity.abilityCooldown--;
    if(entity.invisTimer>0)entity.invisTimer--;
    if(entity.shadowStepTimer>0){entity.shadowStepTimer--;if(entity.shadowStepTimer<=0){entity.damageBoost=1;entity.shadowStepActive=false;}}
    if(entity.sonicPulseActive){entity.sonicPulseTimer--;if(entity.sonicPulseTimer<=0||(entity.physicalShields&&entity.physicalShields.every(s=>s<=0))){entity.sonicPulseActive=false;entity.physicalShields=null;}else{const targs=entity.team==='player'?[...enemies]:[...allies,player];targs.forEach(e=>{if(e&&Math.hypot(e.x-entity.x,e.y-entity.y)<230)e.hp-=50/60;});}}
    if(entity.selfHeal>0)entity.hp=Math.min(entity.maxHp,entity.hp+entity.selfHeal/60);
    entity.weaponState.forEach(ws=>{if(ws&&ws.reloading>0){ws.reloading-=1/60;if(ws.reloading<=0)ws.ammo=entity.weaponData[entity.weaponState.indexOf(ws)]?.mag||20;}});
}

function updateCombat() {
    if(!combatActive||!player)return;
    updateEntity(player);
    if(autoBattle)entityAI(player);
    let dx=0,dy=0;
    if(player.stunned<=0&&!autoBattle){
        if(keys['w']||keys['arrowup'])dy-=1;if(keys['s']||keys['arrowdown'])dy+=1;if(keys['a']||keys['arrowleft'])dx-=1;if(keys['d']||keys['arrowright'])dx+=1;
        if(dx||dy){const len=Math.hypot(dx,dy);player.x+=(dx/len)*Math.min(player.speed,5.5);player.y+=(dy/len)*Math.min(player.speed,5.5);player.x=Math.max(15,Math.min(985,player.x));player.y=Math.max(15,Math.min(625,player.y));}
        if(mouseDown)entityShoot(player,mouseX,mouseY);
    }
    [...enemies].forEach(e=>{updateEntity(e);entityAI(e);});

    // Bullets
    bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.traveled+=Math.hypot(b.vx,b.vy);if(b.x<0||b.x>1000||b.y<0||b.y>640)b.hit=true;});
    bullets.forEach(b=>{if(b.hit)return;const targets=b.isEnemy?[player,...allies]:[...enemies];for(let e of targets){if(!e||e.hp<=0||Math.hypot(b.x-e.x,b.y-e.y)>=e.radius+b.radius+3)continue;
        if(e.physicalShields&&e.physicalShields.length>0){let abs=false;for(let si=0;si<e.physicalShields.length;si++){if(e.physicalShields[si]>0){e.physicalShields[si]-=b.damage;abs=true;if(e.physicalShields[si]<=0){e.physicalShields[si]=0;e.hp=Math.min(e.maxHp,e.hp+e.maxHp*0.25);}break;}}if(abs){b.hit=true;break;}}
        const dmg=b.damage*(e.deathMarked?1.8:1);e.hp-=dmg;totalDamageDealt+=dmg;updateDailyProgress('damage',dmg);b.hit=true;damageNumbers.push({x:b.x,y:b.y,text:'-'+Math.round(dmg),life:30,color:'#fff'});break;
    }});
    bullets=bullets.filter(b=>!b.hit&&b.traveled<b.range);

    // Weather
    if(weather==='storm'){weatherTimer++;if(weatherTimer>180){weatherTimer=0;const lx=100+Math.random()*800,ly=100+Math.random()*440;[player,...allies,...enemies].forEach(e=>{if(e&&Math.hypot(e.x-lx,e.y-ly)<80)e.hp-=50;});}}

    // Deaths
    const deadEnemies=enemies.filter(e=>e.hp<=0);deadEnemies.forEach(e=>{silver+=25;killCount++;totalKills++;updateDailyProgress('kills',1);if(player.robotName&&killCount>favoriteRobotKills){favoriteRobot=player.robotName;favoriteRobotKills=killCount;}particles.push({x:e.x,y:e.y,life:20});});
    enemies=enemies.filter(e=>e.hp>0);

    if(player.hp<=0){playerDied=true;hangarSlots[currentRobotIndex].currentHp=0;let found=false;for(let i=0;i<hangarSlots.length;i++){const idx=(currentRobotIndex+i+1)%hangarSlots.length;if(hangarSlots[idx].robotName&&hangarSlots[idx].currentHp>0){currentRobotIndex=idx;spawnPlayerRobot();found=true;break;}}if(!found){if(battleMode!=='ARENA')gameOver(false);}}
    if(enemies.length===0&&battleMode!=='CAMPAIGN'&&battleMode!=='ARENA'){if(battleMode==='SURVIVAL'){wave++;spawnRobotEnemies(3+wave*2);}else if(battleMode==='CLEAR'){const elapsed=(Date.now()-clearTimer)/1000;const reward=elapsed<30?1000:elapsed<60?500:elapsed<120?200:100;silver+=reward;gameOver(true,`Зачистка за ${Math.floor(elapsed)}сек! +${reward}💰`);}else gameOver(true);}
    if(battleMode==='ARENA'&&enemies.length===0){wave++;spawnArenaWave();}
    if(battleMode==='CAMPAIGN'&&currentCampaignMission){if(currentCampaignMission.type==='kill_all'&&enemies.length===0)campaignVictory();if(player.hp<=0)campaignDefeat();}

    saveAccount();updateCombatUI();
    if(autoBattle&&!combatActive){setTimeout(()=>{returnToHangar();startBattle('TDM');},2000);}
}

function gameOver(v,msg) { combatActive=false; document.getElementById('surrender-btn').style.display='none'; document.getElementById('gameover-panel').style.display='block'; document.getElementById('gameover-text').textContent=msg||(v?'ПОБЕДА!':'ПОРАЖЕНИЕ'); if(v){totalWins++;silver+=150;}else{totalLosses++;} saveAccount(); }
function returnToHangar() { combatActive=false; hangarSlots.forEach(s=>{if(s.robotName)s.currentHp=Math.round(getRobotStat(s,'hp'));}); document.getElementById('surrender-btn').style.display='none'; document.getElementById('gameover-panel').style.display='none'; showHangar(); }
function restartBattle() { returnToHangar(); startBattle(battleMode); }
function surrender() { gameOver(false,'Вы сдались'); }

function updateCombatUI() { if(!player)return; const hpP=Math.max(0,(player.hp/player.maxHp)*100); document.getElementById('robot-info').innerHTML=`<b>${player.robotName}</b><br><div class="health-bar"><div class="health-fill ${hpP<30?'low':''}" style="width:${hpP}%"></div></div><small>${Math.round(player.hp)}/${player.maxHp}</small>`; document.getElementById('hud').innerHTML=`💰${silver} ⭐${gold} 👻${soulCoins} ${weather==='rain'?'🌧️':weather==='fog'?'🌫️':weather==='storm'?'⛈️':'☀️'} ${battleMode==='CLEAR'?Math.floor((Date.now()-clearTimer)/1000)+'сек':''}`; }

function drawRobotShape(entity,isPlayer) {
    if(!entity||!entity.radius)return;const x=entity.x,y=entity.y;ctx.save();ctx.translate(x,y);let angle=isPlayer?Math.atan2(mouseY-y,mouseX-x):0;ctx.rotate(angle);
    if(entity.shadowStepActive&&entity.team==='player')ctx.globalAlpha=0.15;
    ctx.fillStyle=entity.stunned>0?'#ffff00':entity.color;ctx.strokeStyle='#fff';ctx.lineWidth=isPlayer?2:1;
    if(entity.robotName==='Shadow'){ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(12,10);ctx.lineTo(-12,10);ctx.closePath();ctx.fill();ctx.stroke();}
    else {ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();ctx.stroke();}
    ctx.globalAlpha=1;
    if(entity.weaponData&&entity.weaponData.length>0){entity.weaponData.forEach((wd,i)=>{const ang2=isPlayer?Math.atan2(mouseY-y,mouseX-x):0;const wpX=x+Math.cos(ang2)*(entity.radius+10);const wpY=y+Math.sin(ang2)*(entity.radius+10);ctx.fillStyle=wd.color||'#fff';ctx.beginPath();ctx.arc(wpX,wpY,4,0,Math.PI*2);ctx.fill();});}
    if(entity.physicalShields){ctx.strokeStyle='rgba(68,136,255,0.7)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,entity.radius+6,0,Math.PI*2);ctx.stroke();}
    ctx.restore();
}

function drawBattle() {
    ctx.clearRect(0,0,1000,640);ctx.fillStyle='#0a0a14';ctx.fillRect(0,0,1000,640);
    for(let x=0;x<1000;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,640);ctx.strokeStyle='#1a1a2e';ctx.stroke();}
    ctx.globalAlpha=0.5;OBSTACLES.forEach(o=>{ctx.fillStyle='#334';ctx.fillRect(o.x,o.y,o.w,o.h);});ctx.globalAlpha=1;
    if(!combatActive)return;
    if(battleMode==='CONVOY'){convoyTrucks.forEach(t=>{if(t.hp>0){ctx.fillStyle='#4488ff';ctx.fillRect(t.x-15,t.y-10,30,20);ctx.fillStyle='#fff';ctx.fillText('CONVOY',t.x-10,t.y-12);}});}
    allies.forEach(a=>drawRobotShape(a,false));enemies.forEach(e=>drawRobotShape(e,false));
    if(player){drawRobotShape(player,true);ctx.fillStyle=(player.hp/player.maxHp)<0.3?'#f34':'#4c6';ctx.fillRect(player.x-25,player.y-player.radius-16,50*Math.max(0,player.hp/player.maxHp),6);}
    bullets.forEach(b=>{ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);ctx.fill();});
    particles.forEach(p=>{ctx.fillStyle=`rgba(255,150,0,${p.life/20})`;ctx.beginPath();ctx.arc(p.x,p.y,(20-p.life)*2,0,Math.PI*2);ctx.fill();p.life--;});
    damageNumbers=damageNumbers.filter(d=>{d.life--;if(d.life>0){ctx.fillStyle=d.color;ctx.fillText(d.text,d.x,d.y-d.life/2);}return d.life>0;});
    if(weather==='fog'){ctx.fillStyle='rgba(180,180,180,0.3)';ctx.fillRect(0,0,1000,640);}
}

function drawBackground() { ctx.clearRect(0,0,1000,640);ctx.fillStyle='#0a0a14';ctx.fillRect(0,0,1000,640); }
function mainLoop() { if(combatActive){updateCombat();drawBattle();}else{drawBackground();}requestAnimationFrame(mainLoop); }

function setupEventListeners() {
    document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));document.getElementById('tab-'+b.dataset.tab).classList.add('active');}));
    document.getElementById('btn-login').addEventListener('click',()=>{const n=document.getElementById('login-name').value.trim();if(!n||!accounts[n])return;if(loadAccount(n))showHangar();});
    document.getElementById('btn-register').addEventListener('click',()=>{const n=document.getElementById('reg-name').value.trim();if(!n||accounts[n])return;accounts[n]={password:''};initNewAccount(n);showHangar();});
    document.getElementById('btn-guest').addEventListener('click',()=>{const n='Guest_'+Math.floor(Math.random()*9000);accounts[n]={password:''};initNewAccount(n);showHangar();});
    document.getElementById('modal-overlay').addEventListener('click',function(e){if(e.target===this)hideModal();});
}

document.addEventListener('DOMContentLoaded', () => {
    const s=localStorage.getItem('warRobots_v1.36');if(s)try{accounts=JSON.parse(s);}catch(e){}
    setupEventListeners();
    window.addEventListener('keydown',e=>{
        if(e.target.tagName==='INPUT')return;keys[e.key.toLowerCase()]=true;canvas.focus();
        if(!combatActive){if(e.key==='1'||e.key==='z'){selectedSlot=(selectedSlot-1+hangarSlots.length)%hangarSlots.length;updateHangarUI();}if(e.key==='2'||e.key==='x'){selectedSlot=(selectedSlot+1)%hangarSlots.length;updateHangarUI();}if(e.key>='3'&&e.key<='9'){const idx=parseInt(e.key)-1;if(idx<hangarSlots.length){selectedSlot=idx;updateHangarUI();}}}
        if(combatActive&&player&&e.key==='e'&&!abilityUsedThisPress){abilityUsedThisPress=true;useEntityAbility(player,mouseX,mouseY);}
    });
    window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key==='e')abilityUsedThisPress=false;});
    canvas.addEventListener('mousemove',e=>{mouseX=e.clientX-canvas.getBoundingClientRect().left;mouseY=e.clientY-canvas.getBoundingClientRect().top;});
    canvas.addEventListener('mousedown',()=>mouseDown=true);canvas.addEventListener('mouseup',()=>mouseDown=false);
    showLogin();canvas.focus();requestAnimationFrame(mainLoop);
});
</script>
